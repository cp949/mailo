# apps/mailo/scripts/nfs/verify-docker-volume.sh 전용 override. 운영 구성이 아니다.
# docker-compose.yml + docker-compose.nfs-example.yml 위에 덮어 쓴다.
# 환경: VERIFY_ENV_FILE, VERIFY_CALLERS_FILE, VERIFY_PUBLISH_PORT
services:
  postgres:
    ports: !reset []
  mailo:
    env_file: !override
      - ${VERIFY_ENV_FILE}
    ports: !override
      - "127.0.0.1:${VERIFY_PUBLISH_PORT}:3000"
    volumes: !override
      - ${VERIFY_CALLERS_FILE}:/run/mailo/callers.json:ro
      - mailo-files:/var/mailo/files
    restart: "no"
