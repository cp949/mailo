# 마이그레이션을 앱 기동에서 떼어 일회성 서비스로 실행하는 구성 예시(M7). 기본 docker-compose.yml의 동작(기동마다 migrate-cli 실행)은 그대로 둔다.
# docker-compose.yml 위에 덮어 쓴다.
#   docker compose -f docker-compose.yml -f docker-compose.migrate-once.yml up -d --build
# 동작: mailo-migrate가 migrate-cli를 한 번 실행하고 끝난다. mailo는 그것이 성공(service_completed_successfully)해야 시작하고
#       기동 명령에서 migrate-cli를 뺀다. mailo 컨테이너가 재시작해도 마이그레이션을 다시 실행하지 않는다.
# 계정 분리(선택): .env에 MAILO_MIGRATE_DB_USER·MAILO_MIGRATE_DB_PASSWORD(DDL 권한 계정)를 주면 마이그레이션만 그 계정으로 돈다.
#   mailo(앱)는 기존 POSTGRES_USER 계정을 쓴다. 이 경우 앱 계정에 DML 권한만 준다(deployment.md "마이그레이션 일회성 실행").
# 미검증: 이 override를 실행해 확인하지 않았다(docker compose config 문법 확인과 권한 SQL만 확인했다).
services:
  mailo-migrate:
    build:
      context: .
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      MAILO_DATABASE_URL: ""
      MAILO_DATABASE_URL_FILE: ""
      MAILO_DB_HOST: postgres
      MAILO_DB_PORT: "5432"
      MAILO_DB_USER: ${MAILO_MIGRATE_DB_USER:-${POSTGRES_USER:-mailo}}
      MAILO_DB_PASSWORD: ${MAILO_MIGRATE_DB_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env나 환경에 설정한다(.env.example 참고)}}
      MAILO_DB_NAME: ${POSTGRES_DB:-mailo}
    command: ["node", "dist/db/migrate-cli.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  mailo:
    command: ["node", "dist/main.js"]
    depends_on:
      mailo-migrate:
        condition: service_completed_successfully
