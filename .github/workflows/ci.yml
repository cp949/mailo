# Mailo CI. 이 워크플로는 작성만 했고 GitHub에서 실행해 본 적이 없다(docs/operations/ci.md).
# 시크릿은 쓰지 않는다. 아래 비밀번호·키는 모두 테스트용 가짜 값이다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_nfs:
        description: "nfs 잡을 실행한다(GitHub 호스티드 러너에서 통과를 아직 확인하지 못했다)"
        type: boolean
        default: false
  schedule:
    # 주 1회(월요일 18:00 UTC). nfs 잡만 돈다. 나머지 잡은 schedule에서 건너뛴다.
    - cron: "0 18 * * 1"

# 최소 권한. 이 워크플로는 저장소를 읽기만 한다.
permissions:
  contents: read

# 같은 ref의 이전 실행을 취소해 러너 시간을 아낀다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dockerfile의 node:24.20.0-alpine과 같은 버전. .nvmrc는 없고 engines는 범위(>=24.18)라서 고정값을 여기에 둔다.
  NODE_VERSION: "24.20.0"

# 액션은 태그가 가리키는 커밋 SHA로 고정한다(태그는 옮겨질 수 있다). 주석의 버전은 2026-11-23에 확인한 최신 릴리스다.
# - actions/checkout          v7.0.1
# - actions/setup-node        v7.1.0
# - actions/upload-artifact   v7.0.2

jobs:
  static:
    name: static (format, typecheck, lint, build, 단위 테스트)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm 버전은 package.json의 packageManager를 따른다. setup-node의 cache: pnpm보다 먼저 pnpm이 PATH에 있어야 한다.
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  integration:
    name: integration (PostgreSQL)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # docker-compose.yml의 postgres와 같은 이미지(ADR-0006: 13 이상 필수).
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mailo
          POSTGRES_PASSWORD: mailo-dev-password
          POSTGRES_DB: mailo
        ports:
          - 5432:5432
        # 서비스가 healthy가 될 때까지 잡의 첫 단계가 시작되지 않는다.
        options: >-
          --health-cmd "pg_isready -U mailo -d mailo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MAILO_TEST_DATABASE_URL: postgres://mailo:mailo-dev-password@localhost:5432/mailo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  container:
    name: container (SIGKILL·SIGTERM, 같은 호스트 볼륨)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LOG_DIR: ${{ github.workspace }}/ci-logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 스크립트는 sudo가 필요 없다. docker compose v2.24 이상(override의 !override·!reset), openssl, curl이 필요하다.
      - name: 도구 확인
        run: |
          mkdir -p "$LOG_DIR"
          docker version --format '{{.Server.Version}}'
          docker compose version
          openssl version
          curl --version | head -1
      # 스크립트는 관찰값을 출력하고 기대와 다르면 비정상 종료한다. 출력은 실패 시 artifact로 올린다.
      # 앞 단계가 실패해도 나머지를 계속 실행해 실패 항목을 한 번에 본다.
      - name: SIGKILL 중복 발송 재현
        run: scripts/container/verify-sigkill-duplicate.sh 2>&1 | tee "$LOG_DIR/sigkill-duplicate.log"
      - name: SIGTERM 종료(파일 채널 1000건)
        if: ${{ !cancelled() }}
        run: scripts/container/verify-sigterm-file.sh 2>&1 | tee "$LOG_DIR/sigterm-file.log"
      - name: 볼륨 권한 acl
        if: ${{ !cancelled() }}
        run: scripts/volume/verify-permissions.sh acl 2>&1 | tee "$LOG_DIR/volume-permissions-acl.log"
      - name: 볼륨 권한 group
        if: ${{ !cancelled() }}
        run: scripts/volume/verify-permissions.sh group 2>&1 | tee "$LOG_DIR/volume-permissions-group.log"
      - name: 볼륨 root 모델
        if: ${{ !cancelled() }}
        run: scripts/volume/verify-root-model.sh 2>&1 | tee "$LOG_DIR/volume-root-model.log"
      - name: 볼륨 원자적 rename acl
        if: ${{ !cancelled() }}
        run: scripts/volume/verify-atomic-rename.sh acl 2>&1 | tee "$LOG_DIR/volume-atomic-rename-acl.log"
      - name: 볼륨 원자적 rename group
        if: ${{ !cancelled() }}
        run: scripts/volume/verify-atomic-rename.sh group 2>&1 | tee "$LOG_DIR/volume-atomic-rename-group.log"
      - name: 볼륨 e2e acl
        if: ${{ !cancelled() }}
        run: scripts/volume/verify-e2e.sh acl 2>&1 | tee "$LOG_DIR/volume-e2e-acl.log"
      - name: 볼륨 e2e group
        if: ${{ !cancelled() }}
        run: scripts/volume/verify-e2e.sh group 2>&1 | tee "$LOG_DIR/volume-e2e-group.log"
      - name: 실패 시 로그 업로드
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-logs
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14

  nfs:
    name: nfs (선택, 필수 체크 아님)
    # 선택 잡이다. 첫 실행(2026-11-23)에서 NFS 환경 준비는 성공했지만 테스트 단계가 실패해 러너 통과는 확인하지 못했다.
    # 첫 실행 결과를 확인하기 전에는 이 잡을 필수 체크로 지정하지 않는다(docs/operations/ci.md).
    # push·pull_request에서는 돌지 않는다. 수동 실행(run_nfs=true)과 주 1회 schedule에서만 돈다.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_nfs)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mailo
          POSTGRES_PASSWORD: mailo-dev-password
          POSTGRES_DB: mailo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailo -d mailo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MAILO_TEST_DATABASE_URL: postgres://mailo:mailo-dev-password@localhost:5432/mailo
      # setup.sh가 nfs-kernel-server가 없으면 apt로 설치한다(teardown이 되돌리지 않는다. 일회용 러너라 무방하다).
      MAILO_NFS_INSTALL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # setup.sh는 setfacl(acl 패키지)을 요구한다.
      - name: acl 설치
        run: sudo apt-get install -y acl
      # 시간 상한: run.sh의 테스트 상한 MAILO_NFS_RUN_TIMEOUT(기본 1200초) < 이 단계 25분 < 잡 30분.
      # 첫 실행(2026-11-23)에서 테스트가 멈춰 잡 전체 30분을 채웠기 때문에 안쪽 상한을 둔다(docs/operations/ci.md).
      - name: NFS 환경 준비·테스트·정리
        timeout-minutes: 25
        working-directory: apps/mailo
        run: scripts/nfs/run.sh
