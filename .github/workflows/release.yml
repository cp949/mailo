# Mailo 릴리스. vX.Y.Z 태그 push 때 이미지를 ghcr.io/cp949/mailo에 발행하고 GitHub Release를 만든다(docs/operations/ci.md "릴리스 워크플로").
# release 잡 뒤의 variants 잡이 AWS 어댑터 변형 이미지(vX.Y.Z-aws)를 발행한다(ADR-0016 결정 4).
# 시크릿은 GITHUB_TOKEN만 쓴다. 이미지에는 시크릿을 넣지 않는다(RQ-025).
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# 최상위는 읽기만 한다. 쓰기 권한은 release 잡에만 준다.
permissions:
  contents: read

# 같은 태그의 실행을 직렬화한다. 진행 중 실행은 취소하지 않는다(발행 도중 중단 방지).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # ci.yml의 NODE_VERSION과 같은 값(Dockerfile의 node:24.20.0-alpine). 올릴 때 네 곳(두 Dockerfile, ci.yml, release.yml)을 함께 바꾼다.
  NODE_VERSION: "24.20.0"
  IMAGE: ghcr.io/cp949/mailo

# 액션은 태그가 가리키는 커밋 SHA로 고정한다. checkout·setup-node는 ci.yml과 같은 SHA다.
# docker 액션 세 개는 2026-11-23에 releases/latest와 git/ref/tags로 조회한 값이다(세 태그 모두 lightweight, 커밋을 직접 가리킨다).
# - actions/checkout             v7.0.1
# - actions/setup-node           v7.1.0
# - docker/login-action          v4.8.0
# - docker/setup-buildx-action   v4.4.1
# - docker/build-push-action     v7.4.0

jobs:
  verify:
    name: verify (가드, format, typecheck, lint, build, 단위 테스트)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # 조상 확인에 main 이력이 필요해 전체 이력을 받는다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 태그 커밋이 origin/main의 조상인지 확인
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "::error::태그 ${TAG}(${tag_commit})가 origin/main의 조상이 아니다. main에 병합한 커밋에 태그를 단다."
            exit 1
          fi
          echo "태그 ${TAG} 커밋 ${tag_commit}은 origin/main의 조상이다."
      - name: 태그 버전과 package.json version 일치 확인
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          root_version="$(jq -r .version package.json)"
          app_version="$(jq -r .version apps/mailo/package.json)"
          if [ "$root_version" != "$version" ] || [ "$app_version" != "$version" ]; then
            echo "::error::태그 버전 ${version}이 package.json(${root_version}), apps/mailo/package.json(${app_version})과 다르다."
            exit 1
          fi
          echo "버전 ${version} 일치."
      # 통합·컨테이너 검사는 돌리지 않는다. 태그 커밋은 위에서 main의 조상임을 확인했고, main push마다 ci.yml이 전체 잡을 돌린다.
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  release:
    name: release (로컬 빌드, 스모크, GHCR 발행, GitHub Release)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # GitHub Release 생성과 릴리스 노트 생성 API
      packages: write # GHCR push
    # variants 잡이 같은 릴리스 커밋의 기준 이미지(digest) 위에 변형을 만든다.
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tag: ${{ github.ref_name }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 메타데이터 계산
        id: meta
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # 스모크를 통과한 이미지만 발행하려고 빌드는 로컬(docker)로만 하고 push는 뒤 단계의 docker push로 한다.
      # provenance: false: docker push는 로컬 이미지 하나만 올려 attestation을 싣지 못한다. 명시해 빌드 결과를 단일 manifest로 고정한다.
      # load: true면 v7.4.0은 기본 provenance를 붙이지 않는다(src/context.ts getAttestArgs의 hasDockerExporter 조건).
      - name: 이미지 빌드(로컬 load)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.revision=${{ steps.meta.outputs.commit }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      # DB 없이 할 수 있는 확인만 한다. 앱 기동·발송은 ci.yml의 container 잡이 main에서 확인한다.
      # 이 단계가 실패하면 GHCR에는 아무것도 올라가지 않는다.
      - name: 로컬 이미지 스모크
        env:
          REF: ${{ env.IMAGE }}:${{ github.ref_name }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$REF")"
          if [ "$revision" != "$COMMIT" ]; then
            echo "::error::이미지 revision 라벨 ${revision}이 태그 커밋 ${COMMIT}과 다르다."
            exit 1
          fi
          # compose와 같은 보안 옵션으로 실행한다(read_only, cap_drop ALL, no-new-privileges).
          # --pull never: 방금 load한 로컬 이미지만 쓴다.
          run=(docker run --rm --pull never --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true)
          id_out="$("${run[@]}" --entrypoint id "$REF")"
          echo "id: ${id_out}"
          case "$id_out" in
            "uid=1000(node) gid=1000(node)"*) ;;
            *) echo "::error::컨테이너가 node(UID 1000)로 실행되지 않는다."; exit 1 ;;
          esac
          node_out="$("${run[@]}" --entrypoint node "$REF" --version)"
          if [ "$node_out" != "v${NODE_VERSION}" ]; then
            echo "::error::이미지 Node ${node_out}이 NODE_VERSION ${NODE_VERSION}과 다르다."
            exit 1
          fi
          # 빌드 결과·마이그레이션 존재, 런타임 사용자의 코드 쓰기 불가, npm 제거(Dockerfile runtime 단계).
          "${run[@]}" --entrypoint sh "$REF" -c '
            set -e
            test -f dist/main.js
            test -f dist/db/migrate-cli.js
            ls migrations/*.sql >/dev/null
            test ! -w /repo/apps/mailo/dist
            test ! -w /repo/node_modules
            if command -v npm >/dev/null; then echo "npm이 남아 있다"; exit 1; fi
          '
          # 설정 없이 기동하면 모든 모듈을 import한 뒤 설정 검증에서 종료 코드 1과 startup_failed 로그로 끝나야 한다.
          # 운영 의존성 누락이면 import 단계에서 다른 오류로 끝난다.
          set +e
          start_out="$("${run[@]}" "$REF" 2>&1)"
          start_code=$?
          set -e
          echo "$start_out"
          if [ "$start_code" -ne 1 ] || ! grep -q '"event":"startup_failed"' <<<"$start_out"; then
            echo "::error::설정 없는 기동이 종료 코드 1·startup_failed로 끝나지 않았다(종료 코드 ${start_code})."
            exit 1
          fi
      # 스모크한 로컬 이미지를 그대로 push한다. 다시 빌드하지 않는다.
      # 동일성 기준은 config digest다. config에 레이어 diff_id·라벨이 들어 있다. manifest digest는 push 때 레이어를 다시 압축해 달라질 수 있다.
      # latest는 버전 태그 push와 config digest 확인이 끝난 뒤에 붙인다.
      - name: GHCR push(버전 태그 → latest)와 config digest 확인
        id: push
        env:
          REF: ${{ env.IMAGE }}:${{ github.ref_name }}
          LATEST: ${{ env.IMAGE }}:latest
        run: |
          set -o pipefail
          # 레지스트리에 있는 태그의 linux/amd64 config digest. 단일 manifest와 index를 모두 처리한다.
          registry_config() {
            local raw digest
            raw="$(docker buildx imagetools inspect --raw "$1")"
            if jq -e 'has("manifests")' >/dev/null <<<"$raw"; then
              digest="$(jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")][0].digest' <<<"$raw")"
              raw="$(docker buildx imagetools inspect --raw "${IMAGE}@${digest}")"
            fi
            jq -r '.config.digest' <<<"$raw"
          }
          manifest_digest() {
            docker buildx imagetools inspect --format '{{json .Manifest}}' "$1" | jq -r .digest
          }
          # 스모크한 이미지의 config digest. docker save의 manifest.json에서 읽어 이미지 저장소(classic·containerd)와 무관하게 같은 값을 얻는다.
          smoked="sha256:$(docker save "$REF" | tar -xO manifest.json | jq -r '.[0].Config' | grep -oE '[0-9a-f]{64}$')"
          echo "스모크한 이미지 config: ${smoked}"
          docker push "$REF"
          pushed="$(registry_config "$REF")"
          if [ "$pushed" != "$smoked" ]; then
            echo "::error::GHCR ${REF}의 config ${pushed}가 스모크한 이미지 ${smoked}와 다르다. latest는 붙이지 않는다."
            exit 1
          fi
          digest="$(manifest_digest "$REF")"
          docker tag "$REF" "$LATEST"
          docker push "$LATEST"
          latest_digest="$(manifest_digest "$LATEST")"
          if [ "$latest_digest" != "$digest" ]; then
            echo "::error::GHCR latest(${latest_digest})가 ${REF}(${digest})와 다르다."
            exit 1
          fi
          echo "발행: ${REF}, ${LATEST} manifest ${digest} config ${pushed}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      # gh release create는 --generate-notes와 --notes(-file)를 함께 주면 노트를 생성 노트 앞에 붙인다(gh 2.100.0 help).
      # 안내를 끝에 두려고 생성 노트를 API로 받아 뒤에 덧붙인 뒤 --notes-file로 만든다.
      - name: GitHub Release 생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.push.outputs.digest }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # 재실행 때 이미 만든 Release는 건드리지 않는다(이미지는 같은 태그로 다시 push된다).
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release ${TAG}가 이미 있어 만들지 않는다."
            exit 0
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          gh api --method POST "repos/${GH_REPO}/releases/generate-notes" -f tag_name="$TAG" --jq .body > "$notes"
          {
            echo ""
            echo "## 이미지"
            echo ""
            echo '```sh'
            echo "docker pull ${IMAGE}:${TAG}"
            echo '```'
            echo ""
            echo "- 플랫폼: linux/amd64"
            echo "- digest: \`${DIGEST}\`"
            echo ""
            echo "## 업그레이드 주의"
            echo ""
            echo "- 마이그레이션은 자동으로 되돌리지 않는다(down 마이그레이션 없음). 업그레이드 전에 \`pg_dump\`로 백업한다."
            echo "- 이미지 기본 \`CMD\`는 마이그레이션을 실행하지 않는다. compose 밖에서 실행하면 \`node dist/db/migrate-cli.js\`를 먼저 실행한다."
            echo "- 절차: [docs/operations/deployment.md](${REPO_URL}/blob/${TAG}/docs/operations/deployment.md#기동-순서와-마이그레이션)"
            echo ""
            echo "## 변형 이미지"
            echo ""
            echo "- AWS Secrets Manager 어댑터 변형: \`${IMAGE}:${TAG}-aws\`. 이 Release를 만든 뒤 \`variants\` 잡이 발행한다. 기본 이미지에는 어댑터와 AWS SDK가 없다."
            echo "- \`variants\` 잡이 실패하면 \`-aws\` 태그가 없을 수 있다. 기본 이미지와 이 Release는 이미 발행된 상태다. Actions의 \"Re-run failed jobs\"로 변형 잡만 다시 돌린다."
          } >> "$notes"
          gh release create "$TAG" --title "$TAG" --notes-file "$notes" --verify-tag

  # AWS 어댑터 변형 이미지(vX.Y.Z-aws). release 잡이 push한 기준 이미지의 digest 위에 어댑터만 얹는다(ADR-0016 결정 4).
  # 이 잡이 실패해도 기준 이미지와 GitHub Release는 이미 발행된 상태다. Actions의 "Re-run failed jobs"로 이 잡만 다시 돌린다.
  # 스모크를 통과한 이미지만 push한다. 이동 태그(latest-aws)는 만들지 않는다.
  variants:
    name: variants (AWS 어댑터 변형 이미지, 스모크, GHCR 발행)
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # 저장소에는 쓰지 않는다. GHCR push 권한만 필요하다.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # 어댑터 단위 테스트가 실패하면 이미지를 만들지 않는다. pnpm 버전은 어댑터 package.json의 packageManager를 따른다.
      - name: 어댑터 단위 테스트
        working-directory: adapters/secret-source-aws
        run: |
          pnpm install --frozen-lockfile
          pnpm test
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # docker buildx imagetools(레지스트리 config digest 조회)에 buildx 플러그인을 쓴다.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # 기준 이미지는 release 잡이 push한 digest로 가져온다. 태그는 쓰지 않는다(옮겨질 수 있다).
      - name: 기준 이미지 가져오기와 어댑터 부재 확인
        env:
          BASE_REF: ${{ env.IMAGE }}@${{ needs.release.outputs.digest }}
          COMMIT: ${{ needs.release.outputs.commit }}
        run: |
          docker pull "$BASE_REF"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$BASE_REF")"
          if [ "$revision" != "$COMMIT" ]; then
            echo "::error::기준 이미지 revision 라벨 ${revision}이 태그 커밋 ${COMMIT}과 다르다."
            exit 1
          fi
          adapters/secret-source-aws/image-smoke/verify-base.sh "$BASE_REF"
      - name: 변형 이미지 빌드
        env:
          BASE_REF: ${{ env.IMAGE }}@${{ needs.release.outputs.digest }}
          REF: ${{ env.IMAGE }}:${{ needs.release.outputs.tag }}-aws
        run: |
          docker build --build-arg "MAILO_BASE_IMAGE=${BASE_REF}" --tag "$REF" adapters/secret-source-aws
      - name: 변형 이미지 스모크
        env:
          REF: ${{ env.IMAGE }}:${{ needs.release.outputs.tag }}-aws
          COMMIT: ${{ needs.release.outputs.commit }}
        run: |
          # 라벨은 기준 이미지에서 이어받는다. 같은 릴리스 커밋의 이미지인지 확인한다.
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$REF")"
          if [ "$revision" != "$COMMIT" ]; then
            echo "::error::변형 이미지 revision 라벨 ${revision}이 태그 커밋 ${COMMIT}과 다르다."
            exit 1
          fi
          adapters/secret-source-aws/image-smoke/run.sh "$REF"
      # 스모크한 로컬 이미지를 그대로 push한다. 동일성 기준은 release 잡과 같은 config digest다.
      - name: GHCR push와 config digest 확인
        env:
          REF: ${{ env.IMAGE }}:${{ needs.release.outputs.tag }}-aws
        run: |
          set -o pipefail
          registry_config() {
            local raw digest
            raw="$(docker buildx imagetools inspect --raw "$1")"
            if jq -e 'has("manifests")' >/dev/null <<<"$raw"; then
              digest="$(jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")][0].digest' <<<"$raw")"
              raw="$(docker buildx imagetools inspect --raw "${IMAGE}@${digest}")"
            fi
            jq -r '.config.digest' <<<"$raw"
          }
          smoked="sha256:$(docker save "$REF" | tar -xO manifest.json | jq -r '.[0].Config' | grep -oE '[0-9a-f]{64}$')"
          echo "스모크한 변형 이미지 config: ${smoked}"
          docker push "$REF"
          pushed="$(registry_config "$REF")"
          if [ "$pushed" != "$smoked" ]; then
            echo "::error::GHCR ${REF}의 config ${pushed}가 스모크한 이미지 ${smoked}와 다르다."
            exit 1
          fi
          digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$REF" | jq -r .digest)"
          echo "발행: ${REF} manifest ${digest} config ${pushed}"
          echo "발행: \`${REF}\` manifest \`${digest}\`" >> "$GITHUB_STEP_SUMMARY"
