# 샘플 사용처의 비즈니스 DB(PostgreSQL). Mailo의 DB와 별개다. 개발용 가짜 자격이다.
# Mailo 자신의 PostgreSQL은 저장소 루트 docker-compose.yml을 쓴다.
services:
  sample-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample-dev-password
      POSTGRES_DB: sample
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sample -d sample"]
      interval: 5s
      timeout: 5s
      retries: 10
