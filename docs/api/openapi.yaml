          category: TRANSIENT
          smtpCode: 421
          enhancedCode: 4.7.0
          occurredAt: '2026-11-23T09:30:05Z'
        outcomeUncertain: false
        rejectedRecipients:
          - address: park@example.com
            smtpCode: 550
            enhancedCode: 5.1.1
    JobCanceled:
      summary: 호출처가 취소한 작업
      value:
        jobId: 3f0e9a52-6b1d-4c8e-9f27-1a5d7c4b8e90
        idempotencyKey: outbox-8841
        status: CANCELED
        priority: NORMAL
