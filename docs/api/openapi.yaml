openapi: 3.1.0
info:
  title: Mailo REST API
  version: 0.1.0
  summary: Mailo 1단계 REST API 계약 (초안)
  description: |
    Mailo는 Gmail·Google Workspace SMTP로 이메일을 비동기 발송하는 독립 서비스다.
    이 문서는 1단계 REST 계약이다. 근거는 ADR-0001~0008과 요구사항 RQ-001~032이다.
    ADR에 없던 결정은 `docs/api/README.md`의 "계약에서 새로 정한 것" 절에 모았다.

    계약 요약.

    - 모든 업무 endpoint는 `Authorization: Bearer <API 키>`를 요구한다. 헬스 endpoint는 예외다.
    - 발송 등록은 `Idempotency-Key`가 필수다. 유일성 범위는 `(caller_id, Idempotency-Key)`다.
    - 같은 Key와 같은 내용은 200, 같은 Key와 다른 내용은 409다.
    - `SENT`는 SMTP 서버의 수락을 뜻한다. 수신자 받은편지함 도착을 뜻하지 않는다.
    - 발송은 at-least-once다. SMTP 수락 직후 장애가 나면 같은 메일이 두 번 갈 수 있다(RQ-013).
    - 모든 오류 응답은 `application/problem+json`(RFC 9457)이다.
    - 오류 응답, 로그, 거부 기록에는 제목, text, html, 암호문과 요청 값을 넣지 않는다.
    - 첨부파일은 지원하지 않는다. 정의되지 않은 필드(`attachments` 포함)는 400이다.
servers:
  - url: https://mailo.example.internal
    description: 운영 (호스트명은 자리표시자, 추정)
  - url: http://localhost:3000
    description: 개발 (포트는 추정)
tags:
  - name: Jobs
    description: 발송 등록과 작업 조회
  - name: Events
    description: 종결 이벤트 피드 (pull)
  - name: Health
    description: 생존·준비 상태. 인증 없이 호출할 수 있다.
security:
  - bearerAuth: []
paths:
  /jobs:
    post:
      tags: [Jobs]
      operationId: createJob
      summary: 발송 요청 등록
      description: |
        발송 요청을 큐에 등록한다. SMTP 전송 완료를 기다리지 않는다(RQ-007).

        - 새 작업이면 202와 작업을 반환한다. 상태는 `PENDING`이다.
        - 같은 `(caller_id, Idempotency-Key)`가 있고 내용이 같으면 200과 기존 작업을 반환한다.
        - 같은 Key에 내용이 다르면 409다. 두 번째 메일은 등록하지 않는다.
        - 내용 동일 여부는 복호화 뒤 평문의 지문으로 판정한다(ADR-0005 결정 3). 암호문은 비교하지 않는다.
        - 지문 범위는 to, cc, bcc, from, replyTo, subject, text, html이다. 재시도할 때 한 필드라도 바꾸면 409다.
        - 평문 모드(`subject`, `text`, `html`)와 암호화 모드(`content`)는 한 요청에서 섞을 수 없다.
        - 암호화 모드는 수신자·발신자를 먼저 검증하고, 복호화한 뒤에 제목·본문을 검증한다(ADR-0008 결정 3). 지문은 그 뒤에 계산한다. 복호화한 제목·본문의 검증 오류 위치는 모두 `/content`다.
        - 원시 요청이 2 MiB를 넘으면 본문을 읽기 전에도 413으로 거부할 수 있다.
        - 응답의 `Location` 헤더는 `GET /jobs/{jobId}` 경로다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRequest'
            examples:
              plain:
                summary: 평문 모드
                value:
                  to: [kim@example.com]
                  cc: [lee@example.com]
                  from: no-reply@example.com
                  replyTo: support@example.com
                  subject: 주문 접수 안내
                  text: 주문이 접수되었습니다.
                  html: <p>주문이 접수되었습니다.</p>
              encrypted:
                summary: 암호화 모드 (JWE compact, 예시 값이며 실제 암호문이 아니다)
                description: |
                  `content`의 protected header 예시는 아래와 같다.
                  `{"alg":"RSA-OAEP-256","enc":"A256GCM","kid":"mailo-2026-11","caller":"billing"}`
                  평문(payload) 예시는 `{"subject":"주문 접수 안내","text":"주문이 접수되었습니다."}`이다.
                value:
                  to: [kim@example.com]
                  content: eyJhbGciOiJSU0EtT0FFUC0yNTYiLCJlbmMiOiJBMjU2R0NNIiwia2lkIjoibWFpbG8tMjAyNi0xMSIsImNhbGxlciI6ImJpbGxpbmcifQ.Qm9ndXNFbmNyeXB0ZWRLZXlFeGFtcGxl.U29tZUl2RXhhbXBs.Qm9ndXNDaXBoZXJ0ZXh0RXhhbXBsZQ.Qm9ndXNUYWdFeGFtcGxlMTIzNDU
      responses:
        '202':
          description: 새 작업을 등록했다. relay는 완료로 처리한다.
          headers:
            Location:
              $ref: '#/components/headers/JobLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                created:
                  $ref: '#/components/examples/JobPending'
        '200':
          description: 같은 Key와 같은 내용의 요청이 이미 있다. 기존 작업과 현재 상태를 반환한다. relay는 완료로 처리한다.
          headers:
            Location:
              $ref: '#/components/headers/JobLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                duplicateSent:
                  $ref: '#/components/examples/JobSent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 같은 Key에 다른 내용이 왔다. relay는 재시도하지 않고 영구 실패로 기록하며 운영 알림을 낸다.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/IdempotencyConflictProblem'
              examples:
                conflict:
                  summary: 같은 Key, 다른 내용
                  value:
                    type: urn:mailo:problem:idempotency-conflict
                    title: Idempotency-Key conflict
                    status: 409
                    detail: 같은 Idempotency-Key로 다른 내용의 요청이 이미 등록되어 있다.
                    instance: urn:uuid:5f1c2d9e-7a4b-4d1e-9a52-0c3b8f6e2a10
                    jobId: 3f0e9a52-6b1d-4c8e-9f27-1a5d7c4b8e90
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [Jobs]
      operationId: getJobByIdempotencyKey
      summary: Idempotency-Key로 작업 조회
      description: |
        등록된 작업만 반환한다. 파일 채널 호출처는 작업 ID를 받지 못하므로 이 조회를 쓴다(ADR-0006 결정 1).

        - 목록이 아니라 작업 하나를 반환한다.
        - 등록되지 않은 Key, 보존 기간(종결 후 30일)이 지나 삭제된 Key, 다른 호출처의 Key는 모두 404다.
        - 수집 거부와 지문 불일치는 작업으로 남지 않는다. 404이면 이벤트 피드에서 같은 Key의 `INTAKE_REJECTED`를 찾는다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyQuery'
      responses:
        '200':
          description: 작업을 반환한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                retryWait:
                  $ref: '#/components/examples/JobRetryWait'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /jobs/{jobId}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: 작업 ID로 작업 조회
      description: |
        존재하지 않는 ID와 다른 호출처의 작업은 모두 404다.
        본문은 응답에 포함하지 않는다. 종결 후 1일이 지나면 DB에서도 삭제된다.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: 작업을 반환한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                sent:
                  $ref: '#/components/examples/JobSent'
                failed:
                  $ref: '#/components/examples/JobFailed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: 종결 이벤트 피드 조회
      description: |
        호출처 자신의 종결 이벤트와 수집 거부 이벤트를 cursor 순서로 반환한다(ADR-0006 결정 2).

        사용법.

        1. 처음에는 `after` 없이 호출한다.
        2. 응답의 `nextCursor`를 저장하고 다음 호출의 `after`로 쓴다.
        3. `hasMore`가 `true`이면 바로 이어서 호출한다. `false`이면 권장 간격(30초, 추정)으로 폴링한다.

        주의.

        - 같은 이벤트가 다시 올 수 있다. `eventId`로 멱등하게 처리한다.
        - 빈 `events`는 새 이벤트가 없다는 뜻이 아니다. DB에 긴 트랜잭션이 있으면 피드가 지연된다. 이벤트는 유실되지 않는다.
        - cursor는 불투명 문자열이다. 해석하거나 만들지 않는다. 형식은 서버가 바꿀 수 있다.
        - cursor는 `type` 필터와 무관하다. 필터를 바꾸면서 같은 cursor를 이어 쓰면 이벤트를 놓칠 수 있다. 필터 조합마다 cursor를 따로 저장한다.
        - 이벤트는 기록 후 30일 보존한다. 30일 넘게 폴링하지 않으면 그 사이 이벤트를 놓친다.
      parameters:
        - $ref: '#/components/parameters/EventsAfter'
        - $ref: '#/components/parameters/EventsType'
        - $ref: '#/components/parameters/EventsLimit'
      responses:
        '200':
          description: 이벤트 목록과 다음 cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
              examples:
                mixed:
                  summary: 이벤트 종류별 예
                  value:
                    events:
                      - eventId: '1048'
                        type: JOB_SENT
                        occurredAt: '2026-11-23T09:30:12Z'
                        jobId: 3f0e9a52-6b1d-4c8e-9f27-1a5d7c4b8e90
                        idempotencyKey: outbox-8841
                        attempts: 1
                        recipients:
                          to: [kim@example.com, park@example.com]
                          cc: []
                          bcc: []
                        rejectedRecipients:
                          - address: park@example.com
                            smtpCode: 550
                            enhancedCode: 5.1.1
                      - eventId: '1049'
                        type: JOB_FAILED
                        occurredAt: '2026-11-23T09:31:40Z'
                        jobId: 9b7c1e34-2d5a-4f60-8a1c-6e0d3f9b5a22
                        idempotencyKey: outbox-8842
                        attempts: 1
                        recipients:
                          to: [nobody@example.invalid]
                          cc: []
                          bcc: []
                        failureReason: PERMANENT_ERROR
                        lastError:
                          category: PERMANENT
                          smtpCode: 550
                          enhancedCode: 5.1.1
                          occurredAt: '2026-11-23T09:31:40Z'
                      - eventId: '1050'
                        type: JOB_EXPIRED
                        occurredAt: '2026-11-24T08:00:03Z'
                        jobId: c2a84d17-90be-4e3f-b6a5-71f0d2e8c913
                        idempotencyKey: outbox-8790
                        attempts: 3
                        recipients:
                          to: [kim@example.com]
                          cc: []
                          bcc: []
                        failureReason: EXPIRED
                        lastError:
                          category: ACCOUNT
                          smtpCode: 550
                          enhancedCode: 5.4.5
                          occurredAt: '2026-11-24T07:00:01Z'
                      - eventId: '1051'
                        type: INTAKE_REJECTED
                        occurredAt: '2026-11-24T08:02:30Z'
                        rejectionId: '88'
                        idempotencyKey: null
                        fileName: 7c9e6679-7425-40de-944b-e07fc1f90ae7.json
                        fileSize: 412
                        sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                        reasonCode: MALFORMED
                    nextCursor: MTc2MzkwMDAwMDoxMDUx
                    hasMore: false
                empty:
                  summary: 새 이벤트가 없다. nextCursor는 요청의 after 값이다.
                  value:
                    events: []
                    nextCursor: MTc2MzkwMDAwMDoxMDUx
                    hasMore: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: 생존 확인
      description: |
        프로세스가 요청을 처리할 수 있으면 200이다. 외부 의존성을 확인하지 않는다.
        인증이 필요 없다. 응답 필드는 `status` 하나다.
      security: []
      responses:
        '200':
          description: 프로세스가 살아 있다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveResponse'
              examples:
                up:
                  value:
                    status: UP
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: 준비 상태 확인
      description: |
        PostgreSQL 연결을 확인한다. 연결이 안 되면 503이다(RQ-031).

        차단기가 `open`이나 `half_open`이어도 등록과 조회는 정상이므로 200이다.
        오케스트레이터가 인스턴스를 내리지 않게 하기 위해서다. 발송 중지는 `circuitBreaker.state`로 확인한다.

        인증 없이 호출하면 공개 필드만 반환한다.

        | 필드 | 인증 없음 | 유효한 Bearer 있음 |
        | ---- | --------- | ------------------ |
        | `status`, `checks.database` | 반환 | 반환 |
        | `circuitBreaker.state` | 반환 | 반환 |
        | `circuitBreaker.openUntil`, `circuitBreaker.lastReason` | 생략 | 반환 |
        | `eventFeed.latestEventAt`, `eventFeed.lagSeconds` | 생략 | 반환 |

        `openUntil`과 `lastReason`은 계정 인증 실패나 일일 한도 소진 같은 SMTP 계정 상태를 드러낸다.
        외부 탐색에 쓰일 수 있어 인증을 요구한다. SMTP 응답 텍스트와 계정 정보는 어느 경우에도 반환하지 않는다.
        전체 사유와 SMTP 응답 코드는 로그에서 확인한다.

        `eventFeed`는 호출처 자신의 이벤트 피드 지연이다(RQ-017). `GET /events`가 반환할 수 있는 최신 이벤트의 시각(`latestEventAt`)과
        서버 현재 시각에서 그 시각을 뺀 초(`lagSeconds`)다. 이벤트가 없으면 둘 다 `null`이다.
        새 이벤트가 없는 동안에도 값이 커지므로 단독 장애 신호로 쓰지 않는다. DB의 긴 트랜잭션으로 피드가 멈춘 경우에도 커진다(ADR-0006 결정 7).
        다른 호출처의 이벤트는 반영하지 않는다.

        `Authorization` 헤더를 보냈는데 자격이 틀리면 401이다. 공개 응답으로 낮춰 반환하지 않는다.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: 준비됐다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              examples:
                publicClosed:
                  summary: 인증 없음, 정상
                  value:
                    status: UP
                    checks:
                      database: UP
                    circuitBreaker:
                      state: closed
                publicOpen:
                  summary: 인증 없음, 발송 중지. 사유와 재개 시각은 생략한다.
                  value:
                    status: UP
                    checks:
                      database: UP
                    circuitBreaker:
                      state: open
                authenticatedOpen:
                  summary: 유효한 Bearer, 일일 한도 초과로 중지
                  value:
                    status: UP
                    checks:
                      database: UP
                    circuitBreaker:
                      state: open
                      openUntil: '2026-11-23T10:30:00Z'
                      lastReason: QUOTA_DAILY
                    eventFeed:
                      latestEventAt: '2026-11-23T09:58:20Z'
                      lagSeconds: 100
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: PostgreSQL에 연결할 수 없다. 차단기 상태는 알 수 없으므로 `unknown`이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              examples:
                databaseDown:
                  value:
                    status: DOWN
                    checks:
                      database: DOWN
                    circuitBreaker:
                      state: unknown
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key (256비트 난수)
      description: |
        호출처별 API 키를 `Authorization: Bearer <키>`로 보낸다(RQ-028).
        호출처당 키 2개가 동시에 유효하다. `caller_id`는 키에서 얻으며 요청 본문에 쓰지 않는다.
        파일 채널만 쓰는 호출처도 조회와 이벤트 피드를 쓰려면 이 키가 필요하다.
  headers:
    JobLocation:
      description: 작업 조회 경로. `/jobs/{jobId}` 형식이다.
      schema:
        type: string
        examples:
          - /jobs/3f0e9a52-6b1d-4c8e-9f27-1a5d7c4b8e90
    WwwAuthenticate:
      description: 항상 `Bearer`다. 자격 없음, 형식 오류, 틀린 키를 구분해 알리지 않는다.
      schema:
        type: string
        const: Bearer
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        요청 단위로 고유한 값. outbox 행 ID 같은 값을 쓴다. 사용자 ID처럼 여러 요청이 공유하는 값은 409를 일으킨다.
        유일성 범위는 `(caller_id, Idempotency-Key)`이고 채널(REST, 파일)과 무관하다.
        Key 행은 작업 종결 후 30일(추정) 보존한다.
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
      example: outbox-8841
    IdempotencyKeyQuery:
      name: idempotencyKey
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
      example: outbox-8841
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 3f0e9a52-6b1d-4c8e-9f27-1a5d7c4b8e90
    EventsAfter:
      name: after
      in: query
      required: false
      description: 이전 응답의 `nextCursor`. 생략하면 보존 중인 가장 오래된 이벤트부터 반환한다.
      schema:
        $ref: '#/components/schemas/Cursor'
    EventsType:
      name: type
      in: query
      required: false
      description: |
        이벤트 종류 필터. 반복해서 여러 종류를 지정할 수 있다(`type=JOB_FAILED&type=JOB_EXPIRED`). 생략하면 모든 종류다.
        ADR의 `type=<종류>`를 반복 가능으로 확장한 것이다.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/EventType'
        uniqueItems: true
    EventsLimit:
      name: limit
      in: query
      required: false
      description: 한 번에 반환하는 최대 이벤트 수. 기본 100, 최대 500(모두 추정).
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
  schemas:
    IdempotencyKey:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9._:-]+$'
      description: 1~128자, 허용 문자 `[A-Za-z0-9._:-]`(ADR-0005 결정 1).
    Cursor:
      type: string
      minLength: 1
      maxLength: 256
      description: 불투명 문자열. 클라이언트는 해석하지 않고 그대로 저장해 되돌려 보낸다(ADR-0006 결정 7). 최대 길이 256은 추정이다.
      examples:
        - MTc2MzkwMDAwMDoxMDUx
    Address:
      type: string
      format: email
      maxLength: 254
      pattern: '^[^\r\n]+$'
      description: |
        addr-spec 형식의 주소 하나. 표시 이름(`Name <a@b>`)은 1단계에서 지원하지 않는다(추정).
        CR·LF가 있으면 거부한다(헤더 인젝션 방지, RQ-030).
    Subject:
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^[^\r\n]*$'
      description: 제목. 255자 이하이고 CR·LF를 포함하지 않는다.
    JweCompact:
      type: string
      pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
      description: |
        JWE compact serialization(RFC 7516) 문자열. 점으로 구분한 다섯 부분이다.
        `BASE64URL(protected header).BASE64URL(encrypted key).BASE64URL(iv).BASE64URL(ciphertext).BASE64URL(tag)`

        protected header(ADR-0008 결정 1).

        | 필드 | 값 |
        | ---- | -- |
        | `alg` | `RSA-OAEP-256`. Mailo 공개키는 RSA 3072비트다. |
        | `enc` | `A256GCM` |
        | `kid` | Mailo 공개키 식별자. 형식은 `[A-Za-z0-9][A-Za-z0-9._:-]{0,63}`이다. 알 수 없거나 없으면 400 `KID_UNKNOWN`이다. |
        | `caller` | 인증된 `caller_id`와 같아야 한다. 다르면 400 `CALLER_MISMATCH`다. |

        protected header는 AAD로 인증된다. 복호화한 뒤의 `caller`만 믿으므로, 헤더를 바꾸면 `CALLER_MISMATCH`가 아니라 `DECRYPTION_FAILED`다.
        `alg`·`enc`가 위 값이 아니거나 `zip`·`crit`가 있으면 복호화를 시도하지 않고 400 `DECRYPTION_FAILED`다.

        암호화 평문: UTF-8 JSON 객체 `{"subject": ..., "text": ..., "html": ...}`.
        `subject`는 필수이고 `text`와 `html` 중 하나 이상이 필요하다(`null`은 없는 값이다). 다른 필드는 400이다(`UNKNOWN_FIELD`, `attachments`는 `ATTACHMENTS_NOT_SUPPORTED`).
        복호화 뒤의 입력 검증은 평문 모드와 같은 규칙이다(제목 255자, 제목+text+html 합 1 MiB, CR·LF 거부). 오류 위치는 `/content`다.
        복호화에 실패하면 400이며 오류 응답에 암호문과 평문을 넣지 않는다.
    SendRequest:
      type: object
      description: |
        발송 요청. 평문 모드와 암호화 모드 중 하나를 쓴다.

        - 평문 모드: `subject`가 필수이고 `text`와 `html` 중 하나 이상이 필요하다.
        - 암호화 모드: `content`가 필수이고 `subject`, `text`, `html`을 함께 보낼 수 없다.
        - `to`, `cc`, `bcc` 합계는 50명 이하다. 중복 주소도 각각 센다(추정).
        - `from`을 생략하면 Mailo의 SMTP 발신 계정을 쓴다. Gmail은 인증 계정과 다른 From을 덮어쓸 수 있다. 허용 범위 정책은 미결정이다.
        - 제목+text+html은 UTF-8로 1 MiB 이하다. 원시 요청은 2 MiB 이하다.
      required: [to]
      additionalProperties: false
      properties:
        to:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/Address'
        cc:
          type: array
          maxItems: 49
          items:
            $ref: '#/components/schemas/Address'
        bcc:
          type: array
          maxItems: 49
          items:
            $ref: '#/components/schemas/Address'
        from:
          $ref: '#/components/schemas/Address'
        replyTo:
          $ref: '#/components/schemas/Address'
        subject:
          $ref: '#/components/schemas/Subject'
        text:
          type: string
          description: 일반 텍스트 본문.
        html:
          type: string
          description: HTML 본문.
        content:
          $ref: '#/components/schemas/JweCompact'
      oneOf:
        - title: 평문 모드
          required: [subject]
          anyOf:
            - required: [text]
            - required: [html]
          not:
            required: [content]
        - title: 암호화 모드
          required: [content]
          not:
            anyOf:
              - required: [subject]
              - required: [text]
              - required: [html]
    JobStatus:
      type: string
      enum: [PENDING, SENDING, RETRY_WAIT, SENT, FAILED, EXPIRED]
      description: |
        | 값 | 의미 |
        | -- | ---- |
        | `PENDING` | 발송 대기 |
        | `SENDING` | 발송 진행 중 |
        | `RETRY_WAIT` | 실패 후 재시도 대기 |
        | `SENT` | SMTP 서버가 메일을 수락함. 받은편지함 도착을 뜻하지 않고, 일부 수신자만 거부됐을 수 있다. |
        | `FAILED` | 영구 오류, 시도 횟수 소진, 계정 상태 오류 반복으로 중단함 |
        | `EXPIRED` | 만료 시각 도달로 중단함 |

        종결 상태는 `SENT`, `FAILED`, `EXPIRED`다. 종결 상태에서는 전이하지 않는다.
    FailureReason:
      type: string
      enum: [PERMANENT_ERROR, MAX_ATTEMPTS_EXCEEDED, ACCOUNT_ERROR_REPEATED, EXPIRED]
      description: |
        종결 실패의 원인(값 이름은 추정).

        - `PERMANENT_ERROR`: 메시지 단계에서 영구 오류(`5xx`)를 받았다. 전원 거부가 모두 `5xx`인 경우도 포함한다.
          Mailo 내부 오류로 처리하지 못한 작업(독성 작업)이 3회째 시도에서 중단된 경우도 이 값이다. 이때 `lastError.smtpCode`는 `null`이다.
        - `MAX_ATTEMPTS_EXCEEDED`: 최대 시도 횟수를 소진했다.
        - `ACCOUNT_ERROR_REPEATED`: 같은 작업이 차단기를 3회 연 뒤에도 같은 계정 상태 응답을 받았다(ADR-0007 결정 4). 한도 사유(일일·순간 한도)는 제외한다(ADR-0007 구현 중 확정 8).
        - `EXPIRED`: 만료 시각에 도달했다.
    LastError:
      type: object
      description: |
        마지막 시도의 오류 요약. SMTP 응답 텍스트는 수신자 주소를 포함할 수 있어 반환하지 않는다(마스킹 방식 미결정).
      required: [category, smtpCode, enhancedCode, occurredAt]
      additionalProperties: false
      properties:
        category:
          type: string
          enum: [TRANSIENT, PERMANENT, ACCOUNT, LEASE_EXPIRED]
          description: |
            - `TRANSIENT`: 메시지 단계의 일시 오류.
            - `PERMANENT`: 메시지 단계의 영구 오류.
            - `ACCOUNT`: 연결·TLS·인증 실패 또는 한도 초과. 차단기를 연 시도는 시도 횟수에 산입하지 않는다. 차단기가 `closed`로 남은 시도는 작업별 오류로 산입한다(ADR-0007 구현 중 확정 8).
            - `LEASE_EXPIRED`: Worker가 죽어 lease가 만료됐다. 시도 횟수에 산입한다.
        smtpCode:
          type: [integer, 'null']
          description: SMTP 응답 코드. 연결 실패처럼 응답이 없으면 `null`이다.
        enhancedCode:
          type: [string, 'null']
          description: enhanced status code(예 `5.4.5`). 없으면 `null`이다.
        occurredAt:
          type: string
          format: date-time
    RejectedRecipient:
      type: object
      required: [address, smtpCode, enhancedCode]
      additionalProperties: false
      description: |
        SMTP 서버가 거부한 수신자. 일부만 거부되면 작업은 `SENT`가 되고 재시도하지 않는다(ADR-0007 결정 7).
        `4xx`로 거부된 수신자도 재시도하지 않는다. 응답 텍스트는 반환하지 않는다(추정).
      properties:
        address:
          $ref: '#/components/schemas/Address'
        smtpCode:
          type: [integer, 'null']
          description: SMTP 응답 코드. 저장된 기록에서 코드를 읽지 못하면 `null`이다.
        enhancedCode:
          type: [string, 'null']
    Job:
      type: object
      description: 발송 작업. 등록 응답과 조회 응답이 같은 형태다. 본문과 수신자는 포함하지 않는다.
      required:
        - jobId
        - idempotencyKey
        - status
        - attempts
        - createdAt
        - expiresAt
        - sentAt
        - failedAt
        - failureReason
        - lastError
        - rejectedRecipients
      additionalProperties: false
      properties:
        jobId:
          type: string
          format: uuid
        idempotencyKey:
          $ref: '#/components/schemas/IdempotencyKey'
        status:
          $ref: '#/components/schemas/JobStatus'
        attempts:
          type: integer
          minimum: 0
          description: 최대 시도 횟수에 산입되는 시도 수. 계정 상태 오류 시도는 포함하지 않는다(ADR-0007 결정 2).
        createdAt:
          type: string
          format: date-time
          description: 등록 시각.
        expiresAt:
          type: string
          format: date-time
          description: 만료 시각. 등록 시각에 만료 TTL(기본 24시간, 추정)을 더한 값이다.
        sentAt:
          type: [string, 'null']
          format: date-time
          description: SMTP 수락 시각. `SENT`일 때만 값이 있다.
        failedAt:
          type: [string, 'null']
          format: date-time
          description: 실패 종결 시각. `FAILED`와 `EXPIRED`일 때만 값이 있다.
        failureReason:
          oneOf:
            - $ref: '#/components/schemas/FailureReason'
            - type: 'null'
          description: '`FAILED`와 `EXPIRED`일 때만 값이 있다.'
        lastError:
          oneOf:
            - $ref: '#/components/schemas/LastError'
            - type: 'null'
          description: 시도에서 오류가 난 적이 없으면 `null`이다. `SENT` 작업도 이전 시도의 오류를 보여 줄 수 있다.
        rejectedRecipients:
          type: array
          items:
            $ref: '#/components/schemas/RejectedRecipient'
          description: '`SENT`이고 일부 수신자가 거부됐을 때만 값이 있다. 그 밖에는 빈 배열이다.'
    EventType:
      type: string
      enum: [JOB_SENT, JOB_FAILED, JOB_EXPIRED, INTAKE_REJECTED]
    Recipients:
      type: object
      required: [to, cc, bcc]
      additionalProperties: false
      properties:
        to:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        cc:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        bcc:
          type: array
          items:
            $ref: '#/components/schemas/Address'
    EventBase:
      type: object
      required: [eventId, type, occurredAt]
      properties:
        eventId:
          type: string
          description: 이벤트 고유 ID. 재전달 이벤트를 걸러내는 멱등 키로 쓴다. 값의 순서에 의미를 두지 않는다. 불투명 문자열로 다룬다(추정).
        type:
          $ref: '#/components/schemas/EventType'
        occurredAt:
          type: string
          format: date-time
          description: 이벤트 기록 시각. 종결 전이 또는 거부 기록과 같은 트랜잭션의 시각이다.
    JobEvent:
      title: 작업 종결 이벤트
      description: |
        `JOB_SENT`, `JOB_FAILED`, `JOB_EXPIRED`. 작업의 종결 전이와 같은 트랜잭션에서 기록한다.
        주기 sweep의 `EXPIRED` 전이도 같다.
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required:
            - type
            - jobId
            - idempotencyKey
            - attempts
            - recipients
          properties:
            type:
              enum: [JOB_SENT, JOB_FAILED, JOB_EXPIRED]
            jobId:
              type: string
              format: uuid
            idempotencyKey:
              $ref: '#/components/schemas/IdempotencyKey'
            attempts:
              type: integer
              minimum: 0
              description: 최대 시도 횟수에 산입되는 시도 수(`Job.attempts`와 같은 정의).
            recipients:
              $ref: '#/components/schemas/Recipients'
            failureReason:
              $ref: '#/components/schemas/FailureReason'
              description: '`JOB_FAILED`와 `JOB_EXPIRED`에만 있다.'
            lastError:
              oneOf:
                - $ref: '#/components/schemas/LastError'
                - type: 'null'
              description: '`JOB_FAILED`와 `JOB_EXPIRED`에만 있다.'
            rejectedRecipients:
              type: array
              items:
                $ref: '#/components/schemas/RejectedRecipient'
              description: '`JOB_SENT`에만 있다. 거부된 수신자가 없으면 생략하거나 빈 배열이다.'
    IntakeRejectedEvent:
      title: 수집 거부 이벤트
      description: |
        파일 채널에서 수집이 거부된 파일 한 건. 원본은 삭제됐고 본문은 어디에도 남지 않는다.
        REST 요청의 거부는 이 이벤트로 만들지 않는다. REST는 오류 응답으로 알린다.
        파일 이름과 `sha256`으로 호출처가 보유한 원본과 대조한다.
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required:
            - type
            - rejectionId
            - idempotencyKey
            - fileName
            - fileSize
            - sha256
            - reasonCode
          properties:
            type:
              const: INTAKE_REJECTED
            rejectionId:
              type: string
              description: 거부 기록 ID. 불투명 문자열이다. 형식(현재 숫자 문자열)에 의존하지 말고 동일성 비교에만 쓴다.
            idempotencyKey:
              type: [string, 'null']
              description: 파일에서 파싱한 Key. 파싱하지 못했으면 `null`이다.
            fileName:
              type: string
            fileSize:
              type: integer
              minimum: 0
              description: 바이트 수. 일반 파일이 아니라서 내용을 읽지 않은 항목은 0이다.
            sha256:
              type: string
              pattern: '^[0-9a-f]{64}$'
              description: |
                파일 전체의 SHA-256(소문자 hex). 예외 두 가지가 있다.

                - `SIZE_EXCEEDED`: 처음 2 MiB + 1바이트의 SHA-256이다. 파일 전체의 해시가 아니다.
                - 일반 파일이 아니라서 내용을 읽지 않은 항목(심볼릭 링크, FIFO, 하드링크 등): 빈 입력의 SHA-256(`e3b0c442...`)이다.
            reasonCode:
              $ref: '#/components/schemas/RejectionReason'
    RejectionReason:
      type: string
      enum:
        - MALFORMED
        - SIZE_EXCEEDED
        - SIGNATURE_INVALID
        - DECRYPTION_FAILED
        - IDEMPOTENCY_KEY_MISSING
        - IDEMPOTENCY_KEY_INVALID
        - FINGERPRINT_MISMATCH
        - VALIDATION_FAILED
        - ATTACHMENTS_NOT_SUPPORTED
        - CALLER_MISMATCH
        - IAT_OUT_OF_RANGE
      description: |
        수집 거부 사유 코드(값 이름은 추정. 대상은 ADR-0006 결정 3).

        | 값 | 사유 |
        | -- | ---- |
        | `MALFORMED` | 형식 오류. 일반 파일이 아닌 항목(심볼릭 링크, FIFO, 하드링크 등)도 이 값이다 |
        | `SIZE_EXCEEDED` | 원시 크기 2 MiB 초과 |
        | `SIGNATURE_INVALID` | 서명 없음 또는 불일치 |
        | `DECRYPTION_FAILED` | 복호화 실패 |
        | `IDEMPOTENCY_KEY_MISSING` | Key 누락 |
        | `IDEMPOTENCY_KEY_INVALID` | Key 형식 위반 |
        | `FINGERPRINT_MISMATCH` | 같은 Key에 다른 내용 |
        | `VALIDATION_FAILED` | 입력 검증 실패(RQ-030) |
        | `ATTACHMENTS_NOT_SUPPORTED` | `attachments` 포함 |
        | `CALLER_MISMATCH` | JWS·JWE의 `caller`가 폴더의 caller와 다름 |
        | `IAT_OUT_OF_RANGE` | 서명 발행 시각이 허용 범위 밖 |
    Event:
      oneOf:
        - $ref: '#/components/schemas/JobEvent'
        - $ref: '#/components/schemas/IntakeRejectedEvent'
      discriminator:
        propertyName: type
        mapping:
          JOB_SENT: '#/components/schemas/JobEvent'
          JOB_FAILED: '#/components/schemas/JobEvent'
          JOB_EXPIRED: '#/components/schemas/JobEvent'
          INTAKE_REJECTED: '#/components/schemas/IntakeRejectedEvent'
    EventPage:
      type: object
      required: [events, nextCursor, hasMore]
      additionalProperties: false
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        nextCursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
          description: |
            다음 호출의 `after`로 쓴다. 이벤트가 없으면 요청의 `after` 값을 그대로 돌려주고,
            `after`도 없었으면 `null`이다.
        hasMore:
          type: boolean
          description: 지금 읽을 수 있는 이벤트가 더 있으면 `true`다. 피드 지연 구간의 이벤트는 세지 않는다.
    LiveResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          const: UP
    ReadyResponse:
      type: object
      required: [status, checks, circuitBreaker]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [UP, DOWN]
          description: PostgreSQL 연결이 되면 `UP`이다. 차단기 상태는 이 값에 영향을 주지 않는다(추정).
        checks:
          type: object
          required: [database]
          additionalProperties: false
          properties:
            database:
              type: string
              enum: [UP, DOWN]
        circuitBreaker:
          type: object
          description: 전역 SMTP 차단기(ADR-0007 결정 5). `closed`가 아니면 Worker가 발송을 멈췄거나 대표 작업 한 건만 시험 중이다.
          required: [state]
          additionalProperties: false
          properties:
            state:
              type: string
              enum: [closed, open, half_open, unknown]
              description: '`unknown`은 DB에 연결할 수 없어 읽지 못한 경우다.'
            openUntil:
              type: [string, 'null']
              format: date-time
              description: 유효한 Bearer가 있을 때만 반환한다. `open`이 아니면 `null`이다.
            lastReason:
              type:
                - string
                - 'null'
              enum:
                - AUTH_FAILED
                - TLS_FAILED
                - CONNECTION_FAILED
                - QUOTA_DAILY
                - QUOTA_BURST
                - OTHER
                - null
              description: |
                유효한 Bearer가 있을 때만 반환한다. 마지막으로 차단기를 연 사유의 분류다(값 이름은 추정).
                SMTP 응답 텍스트는 포함하지 않는다.
        eventFeed:
          type: object
          description: 호출처 자신의 이벤트 피드 지연(RQ-017). 유효한 Bearer가 있을 때만 반환한다. `503`에서는 반환하지 않는다.
          required: [latestEventAt, lagSeconds]
          additionalProperties: false
          properties:
            latestEventAt:
              type: [string, 'null']
              format: date-time
              description: 피드가 반환할 수 있는 최신 이벤트의 시각. 이벤트가 없으면 `null`이다.
            lagSeconds:
              type: [integer, 'null']
              minimum: 0
              description: 서버 현재 시각 − `latestEventAt`(초). 이벤트가 없으면 `null`이다.
    ValidationErrorItem:
      type: object
      description: |
        필드 하나의 검증 실패. 요청에서 받은 값을 되돌려 주지 않는다.
        위치와 고정 코드만 담는다.
      required: [code]
      additionalProperties: false
      properties:
        pointer:
          type: string
          description: |
            본문 필드의 JSON Pointer(RFC 6901). 예 `/to/0`, `/content`.
            빈 문자열은 본문 전체다. 정의되지 않은 필드(`UNKNOWN_FIELD`)는 필드 이름을 되돌려 주지 않으므로 빈 문자열을 쓴다.
        parameter:
          type: string
          description: 헤더나 쿼리 파라미터 이름. 예 `Idempotency-Key`, `after`.
        code:
          type: string
          enum:
            - REQUIRED
            - INVALID_FORMAT
            - TOO_LONG
            - TOO_MANY
            - TOO_LARGE
            - CONTROL_CHARACTER
            - UNKNOWN_FIELD
            - ATTACHMENTS_NOT_SUPPORTED
            - CONFLICTING_FIELDS
            - DECRYPTION_FAILED
            - KID_UNKNOWN
            - CALLER_MISMATCH
          description: |
            값 이름은 추정이다.

            - `CONTROL_CHARACTER`: 제목이나 주소에 CR·LF가 있다.
            - `TOO_LARGE`: 복호화 뒤 제목+text+html 합이 1 MiB를 넘는다. 원시 크기 초과는 413이다.
            - `CONFLICTING_FIELDS`: `content`와 `subject`·`text`·`html`을 함께 보냈다.
            - `DECRYPTION_FAILED`: JWE 복호화나 인증에 실패했다. 원인을 더 구분하지 않는다. 알 수 없는 `alg`·`enc`, 보호 헤더·암호문 변조, 키 불일치를 포함한다.
            - `KID_UNKNOWN`: JWE `kid`에 맞는 Mailo 개인키가 없거나 `kid`가 없다. Mailo에 JWE 개인키를 설정하지 않은 배치도 같다.
            - `CALLER_MISMATCH`: 복호화에 성공한 JWE의 `caller`가 인증된 호출처와 다르다.
    Problem:
      type: object
      description: |
        RFC 9457 problem details. 미디어 타입은 `application/problem+json`이다.

        본문 노출 금지 규칙.

        - `title`은 `type`마다 고정된 문구다. 요청의 제목, 본문, 수신자 값으로 만들지 않는다.
        - `detail`과 `errors`에 요청에서 받은 값(제목, text, html, 암호문, 복호화 평문, 주소, Key)을 넣지 않는다.
        - 위치는 `pointer`나 `parameter`로, 원인은 고정 `code`로만 알린다.
        - 서버 로그와 거부 기록도 같은 규칙을 따른다(RQ-027).
        - 클라이언트는 `type`으로 분기하고 `title`과 `detail`은 사람이 읽는 용도로만 쓴다.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          enum:
            - urn:mailo:problem:malformed-request
            - urn:mailo:problem:validation-failed
            - urn:mailo:problem:unauthorized
            - urn:mailo:problem:not-found
            - urn:mailo:problem:idempotency-conflict
            - urn:mailo:problem:payload-too-large
            - urn:mailo:problem:unsupported-media-type
            - urn:mailo:problem:service-unavailable
          description: |
            문제 유형. 역참조할 문서가 없는 URN을 쓴다(추정).

            | type | status |
            | ---- | ------ |
            | `malformed-request` | 400, JSON 구문 오류 |
            | `validation-failed` | 400, 스키마·입력 검증·헤더·파라미터 오류 |
            | `unauthorized` | 401 |
            | `not-found` | 404 |
            | `idempotency-conflict` | 409 |
            | `payload-too-large` | 413 |
            | `unsupported-media-type` | 415 |
            | `service-unavailable` | 503 |
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
          description: 요청 단위 식별자 `urn:uuid:<요청 ID>`(추정). 서버 로그에 같은 값이 남아 문의할 때 쓴다.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
          description: '`validation-failed`일 때만 있다.'
    IdempotencyConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            jobId:
              type: string
              format: uuid
              description: 먼저 등록된 작업의 ID(추정). 같은 호출처의 작업이다.
  examples:
    JobPending:
      summary: 새로 등록한 작업
      value:
        jobId: 3f0e9a52-6b1d-4c8e-9f27-1a5d7c4b8e90
        idempotencyKey: outbox-8841
        status: PENDING
        attempts: 0
        createdAt: '2026-11-23T09:30:00Z'
        expiresAt: '2026-11-24T09:30:00Z'
        sentAt: null
        failedAt: null
        failureReason: null
        lastError: null
        rejectedRecipients: []
    JobRetryWait:
      summary: 재시도 대기 중인 작업
      value:
        jobId: 3f0e9a52-6b1d-4c8e-9f27-1a5d7c4b8e90
        idempotencyKey: outbox-8841
        status: RETRY_WAIT
        attempts: 1
        createdAt: '2026-11-23T09:30:00Z'
        expiresAt: '2026-11-24T09:30:00Z'
        sentAt: null
        failedAt: null
        failureReason: null
        lastError:
          category: TRANSIENT
          smtpCode: 421
          enhancedCode: 4.7.0
          occurredAt: '2026-11-23T09:30:05Z'
        rejectedRecipients: []
    JobSent:
      summary: 발송 완료(SMTP 수락). 일부 수신자가 거부됐다.
      value:
        jobId: 3f0e9a52-6b1d-4c8e-9f27-1a5d7c4b8e90
        idempotencyKey: outbox-8841
        status: SENT
        attempts: 2
        createdAt: '2026-11-23T09:30:00Z'
        expiresAt: '2026-11-24T09:30:00Z'
        sentAt: '2026-11-23T09:31:12Z'
        failedAt: null
        failureReason: null
        lastError:
          category: TRANSIENT
          smtpCode: 421
          enhancedCode: 4.7.0
          occurredAt: '2026-11-23T09:30:05Z'
        rejectedRecipients:
          - address: park@example.com
            smtpCode: 550
            enhancedCode: 5.1.1
    JobFailed:
      summary: 영구 오류로 실패
      value:
        jobId: 9b7c1e34-2d5a-4f60-8a1c-6e0d3f9b5a22
        idempotencyKey: outbox-8842
        status: FAILED
        attempts: 1
        createdAt: '2026-11-23T09:31:00Z'
        expiresAt: '2026-11-24T09:31:00Z'
        sentAt: null
        failedAt: '2026-11-23T09:31:40Z'
        failureReason: PERMANENT_ERROR
        lastError:
          category: PERMANENT
          smtpCode: 550
          enhancedCode: 5.1.1
          occurredAt: '2026-11-23T09:31:40Z'
        rejectedRecipients: []
    ProblemMalformed:
      summary: JSON 구문 오류
      value:
        type: urn:mailo:problem:malformed-request
        title: Malformed request
        status: 400
        detail: 요청 본문을 JSON으로 해석할 수 없다.
        instance: urn:uuid:0b7d3a64-1e2f-4c85-8d9a-4f6e7c1b2a33
    ProblemMissingKey:
      summary: Idempotency-Key 누락
      value:
        type: urn:mailo:problem:validation-failed
        title: Validation failed
        status: 400
        detail: 요청이 검증을 통과하지 못했다.
        instance: urn:uuid:7a2e5c18-3b49-4f06-a1d7-9e8c0b5d4f21
        errors:
          - parameter: Idempotency-Key
            code: REQUIRED
    ProblemInvalidFields:
      summary: 필드 검증 실패 (제목에 CR·LF, 수신자 형식 오류, 첨부 포함)
      value:
        type: urn:mailo:problem:validation-failed
        title: Validation failed
        status: 400
        detail: 요청이 검증을 통과하지 못했다.
        instance: urn:uuid:c91f4e07-5d3a-4b28-8e6c-2a1b0f7d9e45
        errors:
          - pointer: /subject
            code: CONTROL_CHARACTER
          - pointer: /to/1
            code: INVALID_FORMAT
          - pointer: /attachments
            code: ATTACHMENTS_NOT_SUPPORTED
    ProblemDecryptionFailed:
      summary: JWE 복호화 실패. 암호문과 평문을 응답에 넣지 않는다.
      value:
        type: urn:mailo:problem:validation-failed
        title: Validation failed
        status: 400
        detail: 요청이 검증을 통과하지 못했다.
        instance: urn:uuid:e3b0c442-98fc-4c14-9afb-f4c8996fb924
        errors:
          - pointer: /content
            code: DECRYPTION_FAILED
    ProblemInvalidCursor:
      summary: cursor 오류
      value:
        type: urn:mailo:problem:validation-failed
        title: Validation failed
        status: 400
        detail: 요청이 검증을 통과하지 못했다.
        instance: urn:uuid:2c26b46b-68ff-4c3e-b0a5-1d9f0e7a6c58
        errors:
          - parameter: after
            code: INVALID_FORMAT
  responses:
    BadRequest:
      description: |
        Key 누락·형식 위반, 스키마·입력 검증 실패, 복호화 실패, 첨부 포함, 정의되지 않은 필드, JSON 구문 오류.
        relay는 재시도하지 않는다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            malformed:
              $ref: '#/components/examples/ProblemMalformed'
            missingKey:
              $ref: '#/components/examples/ProblemMissingKey'
            invalidFields:
              $ref: '#/components/examples/ProblemInvalidFields'
            decryptionFailed:
              $ref: '#/components/examples/ProblemDecryptionFailed'
            invalidCursor:
              $ref: '#/components/examples/ProblemInvalidCursor'
    Unauthorized:
      description: |
        Authorization 헤더가 없거나, Bearer 형식이 아니거나, 키가 틀렸다. 원인을 구분해 알리지 않는다.
        relay는 재시도하지 않는다. 자격을 고친 뒤 사용처가 재전송 절차를 정한다.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthorized:
              value:
                type: urn:mailo:problem:unauthorized
                title: Unauthorized
                status: 401
                detail: 인증에 실패했다.
                instance: urn:uuid:8f434346-648f-4b8e-a0d1-6e5a7c9b1d02
    NotFound:
      description: 존재하지 않거나 다른 호출처의 작업이거나 보존 기간이 지나 삭제됐다. 세 경우를 구분하지 않는다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notFound:
              value:
                type: urn:mailo:problem:not-found
                title: Not found
                status: 404
                detail: 해당 작업을 찾을 수 없다.
                instance: urn:uuid:a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
    PayloadTooLarge:
      description: 원시 요청이 2 MiB(추정 기본값)를 넘었다. relay는 재시도하지 않는다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            tooLarge:
              value:
                type: urn:mailo:problem:payload-too-large
                title: Payload too large
                status: 413
                detail: 요청 크기가 상한을 넘었다.
                instance: urn:uuid:f0e1d2c3-b4a5-4968-8776-5a4b3c2d1e0f
    UnsupportedMediaType:
      description: '`Content-Type`이 `application/json`이 아니다(추정). relay는 재시도하지 않는다.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unsupported:
              value:
                type: urn:mailo:problem:unsupported-media-type
                title: Unsupported media type
                status: 415
                detail: Content-Type은 application/json이어야 한다.
                instance: urn:uuid:11223344-5566-4778-8899-aabbccddeeff
    ServiceUnavailable:
      description: |
        DB 장애 등 Mailo 내부 오류. 작업이 반쯤 등록된 상태는 남지 않는다.
        relay는 같은 Key로 재시도한다. 이 문서에 없는 5xx와 네트워크 오류, 타임아웃도 같다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unavailable:
              value:
                type: urn:mailo:problem:service-unavailable
                title: Service unavailable
                status: 503
                detail: 요청을 처리할 수 없다. 같은 Idempotency-Key로 다시 시도한다.
                instance: urn:uuid:99887766-5544-4332-8110-ffeeddccbbaa
