  /metrics:
    get:
      tags: [Metrics]
      operationId: getMetrics
      summary: Prometheus 지표
      description: |
        Prometheus 텍스트 형식(0.0.4)의 지표를 반환한다(RQ-049~052, ADR-0012). 스크레이프는 인스턴스마다 직접 한다. 로드 밸런서 주소 하나를 타깃으로 두지 않는다.
        읽기 토큰(`MAILO_OPS_TOKEN`)만 받는다. 관리 토큰은 읽기 권한을 포함하지만 이 endpoint에서는 403이다(ADR-0011 결정 1의 예외).
        Prometheus 설정에 관리 토큰이 놓인 오설정이 403으로 바로 드러나게 한다. 호출처 API 키·자격 없음·모르는 값은 401이다.
        `MAILO_OPS_TOKEN`이 없으면 어떤 값도 읽기 권한이 아니다. 관리 토큰이 설정돼 있으면 그 토큰은 이때도 403이고, 그 밖의 값은 401이다.
        읽기 토큰도 관리 토큰도 설정하지 않은 서버는 모든 값에 401이다.

        인증 오류 외에는 항상 200이다. DB 수집이 실패해도 200이고, 실패한 그룹의 전역 지표가 응답에서 빠지며 `mailo_metrics_collect_ok{group}`이 0이다.
        `/health/ready`의 DB 장애 503과 목적이 다르다. DB가 죽은 동안에도 인스턴스 counter와 `collect_ok=0` 신호가 수집돼야 하기 때문이다.

        지표는 두 종류다. 이름 규칙과 전체 목록은 `docs/operations/deployment.md` "지표(`/metrics`)"다.
        - 전역 gauge(`mailo_queue_`, `mailo_breaker_`, `mailo_send_paused`, `mailo_caller_`, `mailo_account_`, `mailo_ops_audit_` 접두): DB에서 정해져 어느 인스턴스가 내도 같다. `max by (...)`로 합친다. `sum`은 인스턴스 수만큼 곱해진다.
        - 인스턴스 값(`mailo_*_total` counter, `mailo_worker_`·`mailo_file_poller_`·`mailo_metrics_` gauge, `process_*`): 이 프로세스가 한 일이다. `sum by (...) (rate(...))`로 합친다. 재시작하면 counter가 0에서 다시 시작한다.

        전역 gauge는 `MAILO_METRICS_CACHE_SECONDS`(기본 5초) 동안 마지막 DB 수집 결과를 다시 쓴다. 두 인스턴스의 값은 그만큼 어긋날 수 있다.
        라벨은 `caller_id`(레지스트리 호출처 또는 `unregistered`), `account_id`(이 인스턴스가 구성한 SMTP 계정 ID 또는 구성에서 빠진 계정의 작업을 묶는 `unregistered`), 값이 닫힌 열거 라벨뿐이다.
        계정이 하나뿐인 배포는 `account_id="default"`뿐이라 이전과 같다. 계정 ID는 운영자가 정한 불투명한 이름이고 호스트·사용자·발신 주소는 어느 라벨·값에도 없다.
        수신자, 제목·본문, `Idempotency-Key`, 작업 ID, SMTP 응답 코드·텍스트, 토큰은 어느 라벨·값에도 없다(RQ-027).
        응답 캐시를 막으려고 `Cache-Control: no-store`를 준다.
      security:
        - metricsReadAuth: []
      responses:
        '200':
          description: 지표. 끝은 개행이다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            text/plain; version=0.0.4; charset=utf-8:
              schema:
                type: string
              examples:
                scrape:
                  summary: 일부만 보인다
                  value: |
                    # HELP mailo_queue_jobs 전역. 큐의 작업 수. due는 점유 가능, scheduled는 재시도·예약 대기, sending은 점유 중이다. due와 scheduled는 10000에서 멈춘다.
                    # TYPE mailo_queue_jobs gauge
                    mailo_queue_jobs{account_id="default",state="due"} 12
                    mailo_queue_jobs{account_id="default",state="scheduled"} 3
                    mailo_queue_jobs{account_id="default",state="sending"} 2
                    # HELP mailo_attempts_total 인스턴스. 이 프로세스가 기록한 시도 결과 수. LEASE_LOST로 버린 결과는 세지 않는다.
                    # TYPE mailo_attempts_total counter
                    mailo_attempts_total{caller_id="billing",account_id="default",result="sent"} 1042
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: 생존 확인
      description: |
        프로세스가 요청을 처리할 수 있으면 200이다. 외부 의존성을 확인하지 않는다.
        인증이 필요 없다. 응답 필드는 `status` 하나다.
      security: []
      responses:
        '200':
          description: 프로세스가 살아 있다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveResponse'
              examples:
                up:
                  value:
                    status: UP
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: 준비 상태 확인
      description: |
        PostgreSQL 연결을 확인한다. 연결이 안 되면 503이다(RQ-031).

        차단기가 `open`이나 `half_open`이어도 등록과 조회는 정상이므로 200이다.
        오케스트레이터가 인스턴스를 내리지 않게 하기 위해서다. 발송 중지는 `circuitBreaker.state`로 확인한다.
        발송 정지(전체·호출처·계정)와 계정 차단기 상태도 200/503에 반영하지 않는다.

        SMTP 계정이 여럿이면 차단기는 계정마다 있다(ADR-0013). `circuitBreaker`는 누가 부르느냐에 따라 값을 정한다. 어느 경우에도 계정 ID와 계정 수는 없다.

        | 호출 | `circuitBreaker` |
        | ---- | ---------------- |
        | 인증 없음, 운영자 토큰 | 모든 계정 중 가장 나쁜 상태(`open` > `half_open` > `closed`). 같은 상태이면 계정 ID 오름차순 첫 계정의 `openUntil`·`lastReason`(인증된 경우) |
        | 호출처 API 키 | 그 호출처가 쓰는 계정의 상태·`openUntil`·`lastReason`. 호출처는 자기 메일이 막혔는지 알 수 있다 |

        단일 계정 배포(`default`만 구성)는 계정 정지를 쓰지 않는 한 값이 이전과 같다. 단일 계정 배포에서도 `default` 계정을 정지하면(`PUT /ops/pauses/accounts/default`) 호출처 키가 `sendPaused.scope: account`를 받는다. 계정이 여럿인 배포에서 인증 없음·운영자 응답의 `closed`는 모든 계정이 `closed`라는 뜻이고,
        `open`·`half_open`은 계정 하나 이상이 그렇다는 뜻이다. 어느 계정인지는 운영자가 `GET /ops/accounts`로 확인한다.
        호출처 키의 `circuitBreaker`는 이전에는 전역 값이었고 이제 자기 계정 값이다. 다른 계정이 막혀도 `closed`일 수 있다.

        인증 없이 호출하면 공개 필드만 반환한다.

        | 필드 | 인증 없음 | 유효한 Bearer 있음 |
        | ---- | --------- | ------------------ |
        | `status`, `checks.database` | 반환 | 반환 |
        | `circuitBreaker.state` | 반환 | 반환 |
        | `circuitBreaker.openUntil`, `circuitBreaker.lastReason` | 생략 | 반환 |
        | `eventFeed.latestEventAt`, `eventFeed.lagSeconds` | 생략 | 반환 |
        | `sendPaused.paused`, `sendPaused.scope` | 생략 | 호출처 API 키일 때 반환 |
        | `sendControls.pausedAccountCount` | 생략 | 운영자 토큰일 때 반환 |

        `openUntil`과 `lastReason`은 계정 인증 실패나 일일 한도 소진 같은 SMTP 계정 상태를 드러낸다.
        외부 탐색에 쓰일 수 있어 인증을 요구한다. SMTP 응답 텍스트와 계정 정보는 어느 경우에도 반환하지 않는다.
        전체 사유와 SMTP 응답 코드는 로그에서 확인한다.

        `eventFeed`는 호출처 자신의 이벤트 피드 지연이다(RQ-017). `GET /events`가 반환할 수 있는 최신 이벤트의 시각(`latestEventAt`)과
        서버 현재 시각에서 그 시각을 뺀 초(`lagSeconds`)다. 이벤트가 없으면 둘 다 `null`이다.
        새 이벤트가 없는 동안에도 값이 커지므로 단독 장애 신호로 쓰지 않는다. DB의 긴 트랜잭션으로 피드가 멈춘 경우에도 커진다(ADR-0006 결정 7).
        다른 호출처의 이벤트는 반영하지 않는다.

        `sendPaused`는 호출처 자신에게 해당하는 발송 정지 요약이다(RQ-043). 전체 정지(`all`), 그 호출처가 쓰는 계정의 정지(`account`), 호출처 정지(`caller`) 순서로 우선한다.
        다른 계정의 정지는 반영하지 않는다. 정지는 `/ops`의 관리 endpoint로 걸고 이 응답의 200/503에는 반영하지 않는다.
        정지된 호출처의 작업은 `PENDING`에 쌓이고 `expiresAt`에 `EXPIRED`가 된다. 호출처는 이 값으로 정지를 알아본다. 이벤트 피드로는 알리지 않는다.

        운영자 토큰(서버가 `MAILO_OPS_TOKEN` 또는 `MAILO_OPS_ADMIN_TOKEN_<이름>`을 설정했을 때)을 Bearer로 보내면 호출처 API 키로 받는 필드에 더해 `sendControls`, `queue`, `worker`, `filePoller`를 반환한다(`eventFeed`·`sendPaused`는 호출처 전용이라 없다).
        읽기 토큰과 관리 토큰의 응답은 같다. 호출처 전체의 적체와 발송 루프 상태라서 호출처 API 키로는 반환하지 않는다. 발송 정지(Worker 정지, 적체)는 이 응답의 200/503에 반영하지 않는다.
        `queue`는 계정별 적체의 합이다. 계정이 둘 이상이면 `dueCount`는 계정별 값을 더한 뒤 10000으로 자른다(계정별 값도 각각 10000에서 멈춘다).
        메일 본문, 수신자, 작업 ID, `caller_id`는 어느 필드에도 없다.

        `Authorization` 헤더를 보냈는데 자격이 틀리면 401이다. 공개 응답으로 낮춰 반환하지 않는다.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: 준비됐다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              examples:
                publicClosed:
                  summary: 인증 없음, 정상
                  value:
                    status: UP
                    checks:
                      database: UP
                    circuitBreaker:
                      state: closed
                publicOpen:
                  summary: 인증 없음, 발송 중지. 사유와 재개 시각은 생략한다.
                  value:
                    status: UP
                    checks:
                      database: UP
                    circuitBreaker:
                      state: open
                authenticatedOpen:
                  summary: 유효한 Bearer, 일일 한도 초과로 중지
                  value:
                    status: UP
                    checks:
                      database: UP
                    circuitBreaker:
                      state: open
                      openUntil: '2026-11-23T10:30:00Z'
                      lastReason: QUOTA_DAILY
                    eventFeed:
                      latestEventAt: '2026-11-23T09:58:20Z'
                      lagSeconds: 100
                    sendPaused:
                      paused: false
                      scope: null
                accountPaused:
                  summary: 유효한 Bearer(호출처 API 키), 이 호출처의 계정이 정지됨. 200이고 status는 UP이다. 계정 ID는 없다.
                  value:
                    status: UP
                    checks:
                      database: UP
                    circuitBreaker:
                      state: closed
                      openUntil: null
                      lastReason: null
                    eventFeed:
                      latestEventAt: '2026-11-24T09:58:20Z'
                      lagSeconds: 100
                    sendPaused:
                      paused: true
                      scope: account
                callerPaused:
                  summary: 유효한 Bearer(호출처 API 키), 이 호출처가 정지됨. 200이고 status는 UP이다.
                  value:
                    status: UP
                    checks:
                      database: UP
                    circuitBreaker:
                      state: closed
                      openUntil: null
                      lastReason: null
                    eventFeed:
                      latestEventAt: '2026-11-24T09:58:20Z'
                      lagSeconds: 100
                    sendPaused:
                      paused: true
                      scope: caller
                operatorStalled:
                  summary: 운영자 토큰, 적체가 쌓이고 점유 루프가 멈춘 것으로 보이는 상태
                  value:
                    status: UP
                    checks:
                      database: UP
                    circuitBreaker:
                      state: closed
                      openUntil: null
                      lastReason: null
                    sendControls:
                      allPaused: false
                      pausedCallerCount: 0
                      pausedAccountCount: 0
                    queue:
                      dueCount: 412
                      dueCountTruncated: false
                      oldestDueAgeSeconds: 960
                      dueCountByPriority: { LOW: 300, NORMAL: 100, HIGH: 10, URGENT: 2 }
                      dueCountTruncatedByPriority: { LOW: false, NORMAL: false, HIGH: false, URGENT: false }
                      oldestDueAgeSecondsByPriority: { LOW: 960, NORMAL: 950, HIGH: 940, URGENT: 930 }
                    worker:
                      state: running
                      inFlight: 0
                      lastPollAt: '2026-11-23T09:44:10Z'
                      lastPollAgeSeconds: 960
                      claimFailureStreak: 0
                      pollLoopCrashed: false
                    filePoller:
                      enabled: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: PostgreSQL에 연결할 수 없다. 차단기 상태는 알 수 없으므로 `unknown`이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              examples:
                databaseDown:
                  value:
                    status: DOWN
                    checks:
                      database: DOWN
                    circuitBreaker:
                      state: unknown
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key (256비트 난수)
      description: |
        호출처별 API 키를 `Authorization: Bearer <키>`로 보낸다(RQ-028).
        호출처당 키 2개가 동시에 유효하다. `caller_id`는 키에서 얻으며 요청 본문에 쓰지 않는다.
        파일 채널만 쓰는 호출처도 조회와 이벤트 피드를 쓰려면 이 키가 필요하다.
    opsReadAuth:
      type: http
      scheme: bearer
      bearerFormat: 운영 읽기 토큰 또는 관리 토큰 (공백 없는 32자 이상)
      description: |
        `/ops`의 읽기 endpoint용(ADR-0011 결정 1). 읽기 토큰(`MAILO_OPS_TOKEN`)과 관리 토큰(`MAILO_OPS_ADMIN_TOKEN_<이름>`)을 모두 받는다.
        호출처 API 키와 모르는 값은 401이다. 업무 endpoint(`/jobs`, `/events`)에서는 어느 운영 토큰도 401이다.
    metricsReadAuth:
      type: http
      scheme: bearer
      bearerFormat: 운영 읽기 토큰 (공백 없는 32자 이상)
      description: |
        `GET /metrics`용(ADR-0012 결정 1). 읽기 토큰(`MAILO_OPS_TOKEN`)만 받는다. `opsReadAuth`와 달리 관리 토큰은 403(`forbidden`)이다.
        Prometheus 설정에는 토큰이 평문 파일로 놓이므로 정지·취소 권한이 있는 관리 토큰이 모니터링 시스템에 퍼지지 않게 한다.
        호출처 API 키와 모르는 값, 헤더 없음은 401이다. 읽기 토큰으로는 업무 endpoint(`/jobs`, `/events`)를 호출할 수 없다(401).
    opsAdminAuth:
      type: http
      scheme: bearer
      bearerFormat: 운영 관리 토큰 (공백 없는 32자 이상)
      description: |
        `/ops`의 변경 endpoint용. 관리 토큰만 받는다. 관리 토큰은 이름마다 하나이고 감사 기록의 `actor`가 된다.
        읽기 토큰은 403(`forbidden`), 호출처 API 키와 모르는 값은 401이다. 서버에 관리 토큰이 하나도 설정되지 않았으면 이 endpoint는 읽기 토큰에 403, 그 밖에 401이다.
  headers:
    JobLocation:
      description: 작업 조회 경로. `/jobs/{jobId}` 형식이다.
      schema:
        type: string
        examples:
          - /jobs/3f0e9a52-6b1d-4c8e-9f27-1a5d7c4b8e90
    NoStore:
      description: 운영 응답은 캐시하지 않는다. 항상 `no-store`다.
      schema:
        type: string
        const: no-store
    CursorGap:
      description: |
        `after` 뒤에서 보존 기간이 지나 삭제된 이벤트가 있다는 신호다. 값은 항상 `true`이고 없으면 신호가 없다.
        본문은 바뀌지 않는다. 호출처는 응답의 이벤트를 처리하고 종결되지 않은 작업을 `GET /jobs?idempotencyKey=`로 확인한다.
      schema:
        type: string
        const: 'true'
    WwwAuthenticate:
      description: 항상 `Bearer`다. 자격 없음, 형식 오류, 틀린 키를 구분해 알리지 않는다.
      schema:
        type: string
        const: Bearer
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        요청 단위로 고유한 값. outbox 행 ID 같은 값을 쓴다. 사용자 ID처럼 여러 요청이 공유하는 값은 409를 일으킨다.
        유일성 범위는 `(caller_id, Idempotency-Key)`이고 채널(REST, 파일)과 무관하다.
        Key 행은 작업 종결 후 30일(추정) 보존한다.
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
      example: outbox-8841
    IdempotencyKeyQuery:
      name: idempotencyKey
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
      example: outbox-8841
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 3f0e9a52-6b1d-4c8e-9f27-1a5d7c4b8e90
    CallerIdPath:
      name: callerId
      in: path
      required: true
      description: 호출처 ID. 레지스트리의 `id` 형식이다. 레지스트리에 있는지는 확인하지 않는다.
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
      example: billing
    AccountIdPath:
      name: accountId
      in: path
      required: true
      description: SMTP 계정 ID. `^[a-z0-9][a-z0-9_-]{0,31}$`이고 `unregistered`는 예약어다. 구성에 있는지는 확인하지 않는다.
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
      example: marketing
    EventsAfter:
      name: after
      in: query
      required: false
      description: 이전 응답의 `nextCursor`. 생략하면 보존 중인 가장 오래된 이벤트부터 반환한다.
      schema:
        $ref: '#/components/schemas/Cursor'
    EventsType:
      name: type
      in: query
      required: false
      description: |
        이벤트 종류 필터. 반복해서 여러 종류를 지정할 수 있다(`type=JOB_FAILED&type=JOB_EXPIRED`). 생략하면 모든 종류다.
        ADR의 `type=<종류>`를 반복 가능으로 확장한 것이다.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/EventType'
        uniqueItems: true
    EventsOnGap:
      name: onGap
      in: query
      required: false
      description: |
        `error`만 받는다. 보내면 `after` 뒤에서 이벤트가 삭제된 경우 헤더 대신 410(`cursor-expired`)으로 답한다.
        다른 값이나 반복은 400이다. 410을 처리하지 못하는 호출처는 보내지 않는다. 모르는 쿼리 파라미터를 무시하는 구버전 서버에 보내도 안전하다.
      schema:
        type: string
        enum: [error]
    EventsLimit:
      name: limit
      in: query
      required: false
      description: 한 번에 반환하는 최대 이벤트 수. 기본 100, 최대 500(모두 추정).
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
  schemas:
    IdempotencyKey:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9._:-]+$'
      description: 1~128자, 허용 문자 `[A-Za-z0-9._:-]`(ADR-0005 결정 1).
    Cursor:
      type: string
      minLength: 1
      maxLength: 256
      description: 불투명 문자열. 클라이언트는 해석하지 않고 그대로 저장해 되돌려 보낸다(ADR-0006 결정 7). 최대 길이 256은 추정이다.
      examples:
        - MTc2MzkwMDAwMDoxMDUx
    Address:
      type: string
      format: email
      maxLength: 254
      pattern: '^[^\r\n]+$'
      description: |
        addr-spec 형식의 주소 하나. 표시 이름(`Name <a@b>`)은 1단계에서 지원하지 않는다(추정).
        CR·LF가 있으면 거부한다(헤더 인젝션 방지, RQ-030).
    Subject:
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^[^\r\n]*$'
      description: 제목. 255자 이하이고 CR·LF를 포함하지 않는다.
    Priority:
      type: string
      enum: [LOW, NORMAL, HIGH, URGENT]
      description: |
        발송 우선순위(RQ-033·035). 대소문자를 구분한다. 생략하면 `NORMAL`이다.
        Worker는 높은 등급(`URGENT` → `HIGH` → `NORMAL` → `LOW`)을 먼저 점유한다. 같은 등급은 오래 기다린 순서다.
        claim 호출의 일부(기본 약 10%, 추정)는 등급을 무시하고 가장 오래 기다린 작업을 고른다. 낮은 등급이 완전히 굶지 않게 하기 위해서다.
        `URGENT`는 즉시 전송을 뜻하지 않는다. 재시도 대기, 호출처 할당, 차단기는 모든 등급에 같게 적용된다.
    JweCompact:
      type: string
      pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
      description: |
        JWE compact serialization(RFC 7516) 문자열. 점으로 구분한 다섯 부분이다.
        `BASE64URL(protected header).BASE64URL(encrypted key).BASE64URL(iv).BASE64URL(ciphertext).BASE64URL(tag)`

        protected header(ADR-0008 결정 1).

        | 필드 | 값 |
        | ---- | -- |
        | `alg` | `RSA-OAEP-256`. Mailo 공개키는 RSA 3072비트다. |
        | `enc` | `A256GCM` |
        | `kid` | Mailo 공개키 식별자. 형식은 `[A-Za-z0-9][A-Za-z0-9._:-]{0,63}`이다. 알 수 없거나 없으면 400 `KID_UNKNOWN`이다. |
        | `caller` | 인증된 `caller_id`와 같아야 한다. 다르면 400 `CALLER_MISMATCH`다. |

        protected header는 AAD로 인증된다. 복호화한 뒤의 `caller`만 믿으므로, 헤더를 바꾸면 `CALLER_MISMATCH`가 아니라 `DECRYPTION_FAILED`다.
        `alg`·`enc`가 위 값이 아니거나 `zip`·`crit`가 있으면 복호화를 시도하지 않고 400 `DECRYPTION_FAILED`다.

        암호화 평문: UTF-8 JSON 객체 `{"subject": ..., "text": ..., "html": ...}`.
        `subject`는 필수이고 `text`와 `html` 중 하나 이상이 필요하다(`null`은 없는 값이다). 다른 필드는 400이다(`UNKNOWN_FIELD`, `attachments`는 `ATTACHMENTS_NOT_SUPPORTED`).
        복호화 뒤의 입력 검증은 평문 모드와 같은 규칙이다(제목 255자, 제목+text+html 합 1 MiB, CR·LF 거부). 오류 위치는 `/content`다.
        복호화에 실패하면 400이며 오류 응답에 암호문과 평문을 넣지 않는다.
    SendRequest:
      type: object
      description: |
        발송 요청. 평문 모드와 암호화 모드 중 하나를 쓴다.

        - 평문 모드: `subject`가 필수이고 `text`와 `html` 중 하나 이상이 필요하다.
        - 암호화 모드: `content`가 필수이고 `subject`, `text`, `html`을 함께 보낼 수 없다.
        - `to`, `cc`, `bcc` 합계는 50명 이하다. 중복 주소도 각각 센다(추정).
        - `from`을 생략하면 호출처의 SMTP 발신 계정의 기본 발신 주소를 쓴다. 쓸 수 있는 `from`은 그 기본 발신 주소와 호출처에 등록된 `allowedFrom`뿐이다(대소문자 무시). 호출처는 계정을 고르지 못하고 요청에 계정 필드는 없다(보내면 `UNKNOWN_FIELD`다). 응답에도 계정 정보는 없다(ADR-0013 결정 6). 그 밖의 주소는 400 `FROM_NOT_ALLOWED`(위치 `/from`)다. 같은 `Idempotency-Key`로 이미 등록된 요청의 재전송은 이 검사를 받지 않는다. Gmail은 인증 계정과 다른 From을 덮어쓸 수 있다.
        - 호출처에 `allowedRecipientDomains`가 있으면 `to`·`cc`·`bcc`의 모든 주소가 그 도메인 중 하나여야 한다(`@` 뒤를 소문자로 바꿔 정확히 비교하고 하위 도메인은 따로 허용한다). 하나라도 어기면 요청 전체를 400 `RECIPIENT_DOMAIN_NOT_ALLOWED`(어긴 주소마다 위치 `/to/0` 등)로 거부하고 작업을 만들지 않는다. 목록이 없으면 제한이 없다. `replyTo`는 제한하지 않는다. 이미 등록된 Key의 재전송은 이 검사를 받지 않는다(ADR-0011 결정 8).
        - `replyTo`는 주소 형식만 검증하고 허용 범위를 두지 않는다.
        - 제목+text+html은 UTF-8로 1 MiB 이하다. 원시 요청은 2 MiB 이하다.
        - `priority`를 생략하면 `NORMAL`이다. `null`, 숫자, 빈 문자열, 정의되지 않은 값(소문자 포함)은 400 `INVALID_FORMAT`(위치 `/priority`)다. 암호화 평문 안의 `priority`는 `UNKNOWN_FIELD`(위치 `/content`)다.
        - `ttlSeconds`를 생략하면 서버 기본 TTL(`MAILO_JOB_EXPIRY_SECONDS`, 기본 86400)이다. 정수가 아닌 값(소수, 문자열, `null` 등)은 400 `INVALID_FORMAT`, 범위 밖 정수는 400 `OUT_OF_RANGE`(위치 `/ttlSeconds`)다. 암호화 평문 안의 `ttlSeconds`는 `UNKNOWN_FIELD`(위치 `/content`)다.
        - `onUncertainOutcome`을 생략하면 `retry`다. `retry`·`fail` 외의 값(`null`, 숫자, 빈 문자열, 대문자 포함)은 400 `INVALID_FORMAT`(위치 `/onUncertainOutcome`)다. 암호화 평문 안의 `onUncertainOutcome`은 `UNKNOWN_FIELD`(위치 `/content`)다. 이 필드를 모르는 이전 버전의 서버는 400 `UNKNOWN_FIELD`로 거부한다. 모든 서버 인스턴스를 교체한 뒤에 보내기 시작한다.
      required: [to]
      additionalProperties: false
      properties:
        to:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/Address'
        cc:
          type: array
          maxItems: 49
          items:
            $ref: '#/components/schemas/Address'
        bcc:
          type: array
          maxItems: 49
          items:
            $ref: '#/components/schemas/Address'
        from:
          $ref: '#/components/schemas/Address'
        replyTo:
          $ref: '#/components/schemas/Address'
        subject:
          $ref: '#/components/schemas/Subject'
        text:
          type: string
          description: 일반 텍스트 본문.
        html:
          type: string
          description: HTML 본문.
        content:
          $ref: '#/components/schemas/JweCompact'
        priority:
          $ref: '#/components/schemas/Priority'
        ttlSeconds:
          type: integer
          minimum: 60
          description: |
            요청별 만료 TTL 초(RQ-039, ADR-0010). 상한은 서버 설정 `MAILO_JOB_EXPIRY_MAX_SECONDS`다. 설정하지 않은 서버의 상한은 기본 TTL과 같다.
            만료 시각은 등록 때 Mailo DB 시각 + `ttlSeconds`로 고정한다. 같은 Key로 다시 보내도 늘어나지 않는다.
            만료 시각 이후에는 새 시도를 시작하지 않는다. 이미 시작한 전송은 끝까지 가므로 만료 시각 직후 도착할 수 있다.
            긴 TTL은 한도 차단이 길어져도 메일이 결국 나가게 할 뿐, 한도로 생긴 지연을 없애지 않는다.
        onUncertainOutcome:
          type: string
          enum: [retry, fail]
          default: retry
          description: |
            메일이 나갔는지 알 수 없는 시도 뒤의 처리(RQ-073·074, ADR-0015). 생략하면 `retry`다. 대소문자를 구분한다.
            알 수 없는 시도는 `Job.outcomeUncertain`의 두 종류다. lease 만료로 회수된 시도와, DATA 단계에서 SMTP 응답 없이 끝난 일시 오류(타임아웃·연결 끊김)다.
            - `retry`: 재시도한다. 같은 메일이 두 번 갈 수 있다(at-least-once).
            - `fail`: 재시도하지 않고 `FAILED`와 `failureReason` `OUTCOME_UNKNOWN`으로 끝낸다. 시도 횟수 소진과 만료 시각보다 먼저 판정한다. 응답 코드가 있는 실패와 DATA 이전 단계의 오류는 `fail`이어도 기존대로 처리한다.
            `fail`은 정확히 한 번을 보장하지 않는다. 점유 직후 프로세스가 죽어 전송 전이었던 시도도 알 수 없는 시도로 보므로 보내지 않은 메일이 종결될 수 있다. 메일이 나갔는데 `OUTCOME_UNKNOWN`이 올 수도 있다.
            DATA 단계에는 서버의 `354` 응답을 기다리는 구간과 수락 응답이 없는 폴백 일시 오류도 들어간다. 서버가 수락하기 전에 연결이 끊겨도 `OUTCOME_UNKNOWN`이 될 수 있다.
            `OUTCOME_UNKNOWN`을 받으면 호출처가 확인한 뒤 새 `Idempotency-Key`로 다시 보낼지 정한다.
            값은 등록 때 작업에 고정한다. 같은 Key로 값을 바꾸거나 생략·`retry`를 바꿔 보내면 409다.
      oneOf:
        - title: 평문 모드
          required: [subject]
          anyOf:
            - required: [text]
            - required: [html]
          not:
            required: [content]
        - title: 암호화 모드
          required: [content]
          not:
            anyOf:
              - required: [subject]
              - required: [text]
              - required: [html]
    JobStatus:
      type: string
      enum: [PENDING, SENDING, RETRY_WAIT, SENT, FAILED, EXPIRED, CANCELED]
      description: |
        | 값 | 의미 |
        | -- | ---- |
        | `PENDING` | 발송 대기 |
        | `SENDING` | 발송 진행 중 |
        | `RETRY_WAIT` | 실패 후 재시도 대기 |
        | `SENT` | SMTP 서버가 메일을 수락함. 받은편지함 도착을 뜻하지 않고, 일부 수신자만 거부됐을 수 있다. |
        | `FAILED` | 영구 오류, 시도 횟수 소진, 계정 상태 오류 반복으로 중단함 |
        | `EXPIRED` | 만료 시각 도달로 중단함 |
        | `CANCELED` | 호출처가 나가기 전에 취소함. 실패가 아니다(RQ-040) |

        종결 상태는 `SENT`, `FAILED`, `EXPIRED`, `CANCELED`다. 종결 상태에서는 전이하지 않는다.
    FailureReason:
      type: string
      enum: [PERMANENT_ERROR, MAX_ATTEMPTS_EXCEEDED, ACCOUNT_ERROR_REPEATED, EXPIRED, OUTCOME_UNKNOWN]
      description: |
        종결 실패의 원인(값 이름은 추정).

        - `PERMANENT_ERROR`: 메시지 단계에서 영구 오류(`5xx`)를 받았다. 전원 거부가 모두 `5xx`인 경우도 포함한다.
          Mailo 내부 오류로 처리하지 못한 작업(독성 작업)이 3회째 시도에서 중단된 경우도 이 값이다. 이때 `lastError.smtpCode`는 `null`이다.
        - `MAX_ATTEMPTS_EXCEEDED`: 최대 시도 횟수를 소진했다.
        - `ACCOUNT_ERROR_REPEATED`: 같은 작업이 차단기를 3회 연 뒤에도 같은 계정 상태 응답을 받았다(ADR-0007 결정 4). 한도 사유(일일·순간 한도)는 제외한다(ADR-0007 구현 중 확정 8).
        - `EXPIRED`: 만료 시각에 도달했다.
        - `OUTCOME_UNKNOWN`: 요청이 `onUncertainOutcome` `fail`을 골랐고 메일이 나갔는지 알 수 없는 시도 뒤에 재시도하지 않고 끝냈다(RQ-074). `outcomeUncertain`은 `true`이고 `lastError.category`는 `LEASE_EXPIRED` 또는 응답 코드가 없는 `TRANSIENT`다. 메일이 이미 나갔을 수 있고 나가지 않았을 수도 있다.
    LastError:
      type: object
      description: |
        마지막 시도의 오류 요약. SMTP 응답 텍스트는 수신자 주소를 포함할 수 있어 반환하지 않는다(분류에는 원문을 쓰고 시도 기록에는 이메일 주소 형태를 `[address]`로 바꿔 저장한다. ADR-0007 구현 중 확정 5).
      required: [category, smtpCode, enhancedCode, occurredAt]
      additionalProperties: false
      properties:
        category:
          type: string
          enum: [TRANSIENT, PERMANENT, ACCOUNT, LEASE_EXPIRED]
          description: |
            - `TRANSIENT`: 메시지 단계의 일시 오류.
            - `PERMANENT`: 메시지 단계의 영구 오류.
            - `ACCOUNT`: 연결·TLS·인증 실패 또는 한도 초과. 차단기를 연 시도는 시도 횟수에 산입하지 않는다. 차단기가 `closed`로 남은 시도는 작업별 오류로 산입한다(ADR-0007 구현 중 확정 8).
            - `LEASE_EXPIRED`: Worker가 죽어 lease가 만료됐다. 시도 횟수에 산입한다.
        smtpCode:
          type: [integer, 'null']
          description: SMTP 응답 코드. 연결 실패처럼 응답이 없으면 `null`이다.
        enhancedCode:
          type: [string, 'null']
          description: enhanced status code(예 `5.4.5`). 없으면 `null`이다.
        occurredAt:
          type: string
          format: date-time
    RejectedRecipient:
      type: object
      required: [address, smtpCode, enhancedCode]
      additionalProperties: false
      description: |
        SMTP 서버가 거부한 수신자. 일부만 거부되면 작업은 `SENT`가 되고 재시도하지 않는다(ADR-0007 결정 7).
        `4xx`로 거부된 수신자도 재시도하지 않는다. 응답 텍스트는 반환하지 않는다(추정).
      properties:
        address:
          $ref: '#/components/schemas/Address'
        smtpCode:
          type: [integer, 'null']
          description: SMTP 응답 코드. 저장된 기록에서 코드를 읽지 못하면 `null`이다.
        enhancedCode:
          type: [string, 'null']
    Job:
      type: object
      description: 발송 작업. 등록 응답과 조회 응답이 같은 형태다. 본문과 수신자는 포함하지 않는다.
      required:
        - jobId
        - idempotencyKey
        - status
        - priority
        - attempts
        - createdAt
        - expiresAt
        - sentAt
        - failedAt
        - failureReason
        - canceledAt
        - canceledBy
        - lastError
        - outcomeUncertain
        - rejectedRecipients
      additionalProperties: false
      properties:
        jobId:
          type: string
          format: uuid
        idempotencyKey:
          $ref: '#/components/schemas/IdempotencyKey'
        status:
          $ref: '#/components/schemas/JobStatus'
        priority:
          allOf:
            - $ref: '#/components/schemas/Priority'
          description: 등록한 우선순위. 생략해 등록한 작업과 이 기능 도입 전에 등록한 작업은 `NORMAL`이다. 이벤트 피드에는 없다.
        attempts:
          type: integer
          minimum: 0
          description: 최대 시도 횟수에 산입되는 시도 수. 계정 상태 오류 시도는 포함하지 않는다(ADR-0007 결정 2).
        createdAt:
          type: string
          format: date-time
          description: 등록 시각.
        expiresAt:
          type: string
          format: date-time
          description: 만료 시각. 등록 시각에 요청 `ttlSeconds`(생략하면 서버 기본 TTL, 기본 24시간, 추정)를 더한 값이다. 이 시각 이후 새 시도를 시작하지 않는다.
        sentAt:
          type: [string, 'null']
          format: date-time
          description: SMTP 수락 시각. `SENT`일 때만 값이 있다.
        failedAt:
          type: [string, 'null']
          format: date-time
          description: 실패 종결 시각. `FAILED`와 `EXPIRED`일 때만 값이 있다. `CANCELED`에서는 `null`이다.
        failureReason:
          oneOf:
            - $ref: '#/components/schemas/FailureReason'
            - type: 'null'
          description: '`FAILED`와 `EXPIRED`일 때만 값이 있다. `CANCELED`에서는 `null`이다.'
        canceledAt:
          type: [string, 'null']
          format: date-time
          description: 취소 시각. `CANCELED`일 때만 값이 있다.
        canceledBy:
          type: [string, 'null']
          enum: [CALLER, OPERATOR, null]
          description: |
            취소한 주체. `CANCELED`일 때만 값이 있다. `CALLER`는 호출처 API로, `OPERATOR`는 운영자가 취소한 경우다. 운영자 이름은 노출하지 않는다.
        lastError:
          oneOf:
            - $ref: '#/components/schemas/LastError'
            - type: 'null'
          description: 시도에서 오류가 난 적이 없으면 `null`이다. `SENT` 작업도 이전 시도의 오류를 보여 줄 수 있다.
        outcomeUncertain:
          type: boolean
          description: |
            SMTP 서버가 메일을 수락했는지 알 수 없는 시도가 한 건이라도 있었으면 `true`다. 모든 상태에서 항상 있고 `true`·`false` 중 하나다.
            `FAILED`·`EXPIRED`에서 `true`이면 메일이 이미 나갔을 수 있다. `SENT`에서 `true`이면 더 일찍 나갔을 수 있다. 중간 상태에서는 지금까지의 시도를 따른다.
            `true`인 시도는 두 종류다. lease 만료로 회수된 시도(`lastError.category`가 `LEASE_EXPIRED`일 수 있다)와, DATA 단계에서 SMTP 응답 없이 끝난 일시 오류(타임아웃·연결 끊김)다.
            SMTP 응답 코드가 있는 실패(수신 거부 `550` 등)와 DATA 이전 단계의 실패는 `false`다.
            서버가 응답했지만 Mailo가 받지 못한 경우처럼 위 두 종류에 없는 불명은 잡지 못한다. 시도가 없는 작업은 `false`다. 취소된 작업은 취소 전 시도를 따른다. 시도 이력이 지워지는 보존 기간(30일) 뒤에는 작업 조회가 404다.
            표시일 뿐 재시도 정책은 바꾸지 않는다. 운영자 재시도 API는 없다. 다시 보낼지는 호출처가 정하고, 보낸다면 새 `Idempotency-Key`로 등록한다. 같은 내용이 이미 수신자에게 갔을 수 있으므로 중복 수신 위험은 호출처가 판단한다.
        rejectedRecipients:
          type: array
          items:
            $ref: '#/components/schemas/RejectedRecipient'
          description: '`SENT`이고 일부 수신자가 거부됐을 때만 값이 있다. 그 밖에는 빈 배열이다. 이벤트의 수신자와 같은 유예(기본 7일) 뒤에는 `SENT`여도 빈 배열이다(RQ-072).'
    EventType:
      type: string
      enum: [JOB_SENT, JOB_FAILED, JOB_EXPIRED, JOB_CANCELED, INTAKE_REJECTED]
    Recipients:
      type: object
      required: [to, cc, bcc]
      additionalProperties: false
      properties:
        to:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        cc:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        bcc:
          type: array
          items:
            $ref: '#/components/schemas/Address'
    EventBase:
      type: object
      required: [eventId, type, occurredAt]
      properties:
        eventId:
          type: string
          description: 이벤트 고유 ID. 재전달 이벤트를 걸러내는 멱등 키로 쓴다. 값의 순서에 의미를 두지 않는다. 불투명 문자열로 다룬다(추정).
        type:
          $ref: '#/components/schemas/EventType'
        occurredAt:
          type: string
          format: date-time
          description: 이벤트 기록 시각. 종결 전이 또는 거부 기록과 같은 트랜잭션의 시각이다.
    JobEvent:
      title: 작업 종결 이벤트
      description: |
        `JOB_SENT`, `JOB_FAILED`, `JOB_EXPIRED`, `JOB_CANCELED`. 작업의 종결 전이와 같은 트랜잭션에서 기록한다.
        주기 sweep의 `EXPIRED` 전이도 같다. `JOB_CANCELED`는 호출처가 직접 취소해도 쓴다. outbox를 이벤트로 닫는 호출처가 취소를 알아야 하기 때문이다.
        `JOB_FAILED`·`JOB_EXPIRED`는 `outcomeUncertain`을 더한다(ADR-0011 결정 5). 이벤트 스키마는 `additionalProperties`를 닫지 않았지만 호출처 코드가 필드를 엄격히 검사하면 같은 계약 변경이다.
        네 종류 모두 `recipientsRedacted`를 항상 낸다(RQ-072, ADR-0015 결정 3). 유예 뒤에는 `recipients`와 `rejectedRecipients`가 비어 있다.
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required:
            - type
            - jobId
            - idempotencyKey
            - attempts
            - recipientsRedacted
            - recipients
          properties:
            type:
              enum: [JOB_SENT, JOB_FAILED, JOB_EXPIRED, JOB_CANCELED]
            jobId:
              type: string
              format: uuid
            idempotencyKey:
              $ref: '#/components/schemas/IdempotencyKey'
            attempts:
              type: integer
              minimum: 0
              description: 최대 시도 횟수에 산입되는 시도 수(`Job.attempts`와 같은 정의).
            recipientsRedacted:
              type: boolean
              description: |
                서버가 유예(기본 7일) 뒤 이 이벤트의 수신자를 비웠으면 `true`다. 네 종류 모두 항상 있다.
                `true`이면 `recipients`의 `to`·`cc`·`bcc`는 빈 배열이고 `rejectedRecipients`는 빈 배열이다. `false`이면 기록한 값이다. 비운 값은 복원하지 못한다.
            recipients:
              $ref: '#/components/schemas/Recipients'
              description: '이벤트 기록 시점의 수신자. `recipientsRedacted`가 `true`이면 세 목록이 모두 비어 있다.'
            failureReason:
              $ref: '#/components/schemas/FailureReason'
              description: '`JOB_FAILED`와 `JOB_EXPIRED`에만 있다.'
            lastError:
              oneOf:
                - $ref: '#/components/schemas/LastError'
                - type: 'null'
              description: '`JOB_FAILED`와 `JOB_EXPIRED`에만 있다.'
            outcomeUncertain:
              type: boolean
              description: |
                `JOB_FAILED`와 `JOB_EXPIRED`에만 있고 이 두 종류에서는 항상 있다. `JOB_SENT`·`JOB_CANCELED`에는 없다.
                `Job.outcomeUncertain`과 같은 판정이다. `true`이면 메일이 이미 나갔을 수 있다. 의미와 한계는 `Job.outcomeUncertain`을 따른다.
            rejectedRecipients:
              type: array
              items:
                $ref: '#/components/schemas/RejectedRecipient'
              description: '`JOB_SENT`에만 있다. 거부된 수신자가 없거나 `recipientsRedacted`가 `true`이면 생략하거나 빈 배열이다.'
            canceledBy:
              type: string
              enum: [CALLER, OPERATOR]
              description: '`JOB_CANCELED`에만 있다. `Job.canceledBy`와 같다. `JOB_CANCELED`에는 `failureReason`, `lastError`, `rejectedRecipients`가 없다.'
    IntakeRejectedEvent:
      title: 수집 거부 이벤트
      description: |
        파일 채널에서 수집이 거부된 파일 한 건. 원본은 삭제됐고 본문은 어디에도 남지 않는다.
        REST 요청의 거부는 이 이벤트로 만들지 않는다. REST는 오류 응답으로 알린다.
        파일 이름과 `sha256`으로 호출처가 보유한 원본과 대조한다.
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required:
            - type
            - rejectionId
            - idempotencyKey
            - fileName
            - fileSize
            - sha256
            - reasonCode
          properties:
            type:
              const: INTAKE_REJECTED
            rejectionId:
              type: string
              description: 거부 기록 ID. 불투명 문자열이다. 형식(현재 숫자 문자열)에 의존하지 말고 동일성 비교에만 쓴다.
            idempotencyKey:
              type: [string, 'null']
              description: 파일에서 파싱한 Key. 파싱하지 못했으면 `null`이다.
            fileName:
              type: string
            fileSize:
              type: integer
              minimum: 0
              description: 바이트 수. 일반 파일이 아니라서 내용을 읽지 않은 항목은 0이다.
            sha256:
              type: string
              pattern: '^[0-9a-f]{64}$'
              description: |
                파일 전체의 SHA-256(소문자 hex). 예외 두 가지가 있다.

                - `SIZE_EXCEEDED`: 처음 2 MiB + 1바이트의 SHA-256이다. 파일 전체의 해시가 아니다.
                - 일반 파일이 아니라서 내용을 읽지 않은 항목(심볼릭 링크, FIFO, 하드링크 등): 빈 입력의 SHA-256(`e3b0c442...`)이다.
            reasonCode:
              $ref: '#/components/schemas/RejectionReason'
    RejectionReason:
      type: string
      enum:
        - MALFORMED
        - SIZE_EXCEEDED
        - SIGNATURE_INVALID
        - DECRYPTION_FAILED
        - IDEMPOTENCY_KEY_MISSING
        - IDEMPOTENCY_KEY_INVALID
        - FINGERPRINT_MISMATCH
        - VALIDATION_FAILED
        - ATTACHMENTS_NOT_SUPPORTED
        - CALLER_MISMATCH
        - IAT_OUT_OF_RANGE
      description: |
        수집 거부 사유 코드(값 이름은 추정. 대상은 ADR-0006 결정 3).

        | 값 | 사유 |
        | -- | ---- |
        | `MALFORMED` | 형식 오류. 일반 파일이 아닌 항목(심볼릭 링크, FIFO, 하드링크 등)도 이 값이다 |
        | `SIZE_EXCEEDED` | 원시 크기 2 MiB 초과 |
        | `SIGNATURE_INVALID` | 서명 없음 또는 불일치 |
        | `DECRYPTION_FAILED` | 복호화 실패 |
        | `IDEMPOTENCY_KEY_MISSING` | Key 누락 |
        | `IDEMPOTENCY_KEY_INVALID` | Key 형식 위반 |
        | `FINGERPRINT_MISMATCH` | 같은 Key에 다른 내용 |
        | `VALIDATION_FAILED` | 입력 검증 실패(RQ-030) |
        | `ATTACHMENTS_NOT_SUPPORTED` | `attachments` 포함 |
        | `CALLER_MISMATCH` | JWS·JWE의 `caller`가 폴더의 caller와 다름 |
        | `IAT_OUT_OF_RANGE` | 서명 발행 시각이 허용 범위 밖 |
    Event:
      oneOf:
        - $ref: '#/components/schemas/JobEvent'
        - $ref: '#/components/schemas/IntakeRejectedEvent'
      discriminator:
        propertyName: type
        mapping:
          JOB_SENT: '#/components/schemas/JobEvent'
          JOB_FAILED: '#/components/schemas/JobEvent'
          JOB_EXPIRED: '#/components/schemas/JobEvent'
          JOB_CANCELED: '#/components/schemas/JobEvent'
          INTAKE_REJECTED: '#/components/schemas/IntakeRejectedEvent'
    EventPage:
      type: object
      required: [events, nextCursor, hasMore]
      additionalProperties: false
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        nextCursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
          description: |
            다음 호출의 `after`로 쓴다. 이벤트가 없으면 요청의 `after` 값을 그대로 돌려주고,
            `after`도 없었으면 `null`이다.
        hasMore:
          type: boolean
          description: 지금 읽을 수 있는 이벤트가 더 있으면 `true`다. 피드 지연 구간의 이벤트는 세지 않는다.
    LiveResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          const: UP
    ReadyResponse:
      type: object
      required: [status, checks, circuitBreaker]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [UP, DOWN]
          description: PostgreSQL 연결이 되면 `UP`이다. 차단기 상태는 이 값에 영향을 주지 않는다(추정).
        checks:
          type: object
          required: [database]
          additionalProperties: false
          properties:
            database:
              type: string
              enum: [UP, DOWN]
        circuitBreaker:
          type: object
          description: |
            SMTP 차단기(ADR-0007 결정 5, ADR-0013 결정 5). 차단기는 계정마다 있다. 호출처 API 키는 그 호출처 계정의 상태이고
            인증 없음과 운영자 토큰은 모든 계정 중 가장 나쁜 상태(`open` > `half_open` > `closed`)다. 계정 ID는 담지 않는다.
            `closed`가 아니면 해당 계정의 Worker가 발송을 멈췄거나 대표 작업 한 건만 시험 중이다.
          required: [state]
          additionalProperties: false
          properties:
            state:
              type: string
              enum: [closed, open, half_open, unknown]
              description: '`unknown`은 DB에 연결할 수 없어 읽지 못한 경우다.'
            openUntil:
              type: [string, 'null']
              format: date-time
              description: 유효한 Bearer가 있을 때만 반환한다. `open`이 아니면 `null`이다.
            lastReason:
              type:
                - string
                - 'null'
              enum:
                - AUTH_FAILED
                - TLS_FAILED
                - CONNECTION_FAILED
                - QUOTA_DAILY
                - QUOTA_BURST
                - OTHER
                - null
              description: |
                유효한 Bearer가 있을 때만 반환한다. 마지막으로 차단기를 연 사유의 분류다(값 이름은 추정).
                SMTP 응답 텍스트는 포함하지 않는다.
        eventFeed:
          type: object
          description: 호출처 자신의 이벤트 피드 지연(RQ-017). 유효한 Bearer가 있을 때만 반환한다. `503`에서는 반환하지 않는다.
          required: [latestEventAt, lagSeconds]
          additionalProperties: false
          properties:
            latestEventAt:
              type: [string, 'null']
              format: date-time
              description: 피드가 반환할 수 있는 최신 이벤트의 시각. 이벤트가 없으면 `null`이다.
            lagSeconds:
              type: [integer, 'null']
              minimum: 0
              description: 서버 현재 시각 − `latestEventAt`(초). 이벤트가 없으면 `null`이다.
        sendPaused:
          type: object
          description: |
            호출처 API 키가 있을 때만 반환한다(`eventFeed`와 같다). 그 호출처에 해당하는 발송 정지만 요약한다(RQ-043, ADR-0011 결정 2, ADR-0013 결정 5).
            `scope`는 `all`(전체 정지), `account`(그 호출처가 쓰는 계정의 정지), `caller`(호출처 정지) 순서로 우선한다. 정지가 없으면 `{ paused: false, scope: null }`이다.
            호출처 ID, 계정 ID, 운영자 이름, 시각은 담지 않는다. 운영자 토큰 응답에는 없다. 이 응답의 200/503에는 반영하지 않는다.
          required: [paused, scope]
          additionalProperties: false
          properties:
            paused:
              type: boolean
            scope:
              type: [string, 'null']
              enum: [all, account, caller, null]
        sendControls:
          type: object
          description: |
            운영자 토큰(읽기·관리)이 있을 때만 반환한다. 발송 정지 요약이다. 호출처·계정 ID는 담지 않는다(`caller_id`는 어느 필드에도 없다).
            정지한 호출처·계정 목록은 `GET /ops/pauses`로 읽는다.
          required: [allPaused, pausedCallerCount, pausedAccountCount]
          additionalProperties: false
          properties:
            allPaused:
              type: boolean
            pausedCallerCount:
              type: integer
              minimum: 0
            pausedAccountCount:
              type: integer
              minimum: 0
              description: 정지한 계정 수. 구성에 없는 계정의 정지 행도 센다.
        queue:
          type: object
          description: 운영자 토큰이 있을 때만 반환한다. 점유 대상 작업의 적체. 차단기가 `open`이거나 호출처 할당에 걸린 작업도 센다.
          required:
            - dueCount
            - dueCountTruncated
            - oldestDueAgeSeconds
            - dueCountByPriority
            - dueCountTruncatedByPriority
            - oldestDueAgeSecondsByPriority
          additionalProperties: false
          properties:
            dueCount:
              type: integer
              minimum: 0
              maximum: 10000
              description: '`PENDING`·`RETRY_WAIT`이고 `next_attempt_at`이 지난 작업 수. SMTP 계정이 여럿이면 계정별로 센 값의 합이다. 상한 10000이고 합이 넘으면 10000으로 자르고 `dueCountTruncated`가 true다.'
            dueCountTruncated:
              type: boolean
              description: 실제로 상한보다 많다.
            oldestDueAgeSeconds:
              type: [integer, 'null']
              minimum: 0
              description: 가장 오래 기다린 작업이 점유 가능해진 뒤 지난 초. 대기 작업이 없으면 `null`이다.
            dueCountByPriority:
              type: object
              description: 등급별 `dueCount`(RQ-037). 네 등급이 항상 키로 있다. 상한 10000이 등급마다 따로 걸려 합이 `dueCount`와 다를 수 있다.
              required: [LOW, NORMAL, HIGH, URGENT]
              additionalProperties: false
              properties:
                LOW: { type: integer, minimum: 0, maximum: 10000 }
                NORMAL: { type: integer, minimum: 0, maximum: 10000 }
                HIGH: { type: integer, minimum: 0, maximum: 10000 }
                URGENT: { type: integer, minimum: 0, maximum: 10000 }
            dueCountTruncatedByPriority:
              type: object
              description: 등급별 `dueCountTruncated`. true인 등급은 상한보다 많다.
              required: [LOW, NORMAL, HIGH, URGENT]
              additionalProperties: false
              properties:
                LOW: { type: boolean }
                NORMAL: { type: boolean }
                HIGH: { type: boolean }
                URGENT: { type: boolean }
            oldestDueAgeSecondsByPriority:
              type: object
              description: 등급별 `oldestDueAgeSeconds`. 그 등급의 대기 작업이 없으면 `null`이다.
              required: [LOW, NORMAL, HIGH, URGENT]
              additionalProperties: false
              properties:
                LOW: { type: [integer, 'null'], minimum: 0 }
                NORMAL: { type: [integer, 'null'], minimum: 0 }
                HIGH: { type: [integer, 'null'], minimum: 0 }
                URGENT: { type: [integer, 'null'], minimum: 0 }
        worker:
          type: object
          description: 운영자 토큰이 있을 때만 반환한다. 응답한 인스턴스의 Worker 상태. Worker를 켜지 않은 앱은 `state`가 `disabled`뿐이다.
          required: [state]
          additionalProperties: false
          properties:
            state:
              type: string
              enum: [disabled, idle, running, paused, stopping, stopped]
            inFlight:
              type: integer
              minimum: 0
            lastPollAt:
              type: [string, 'null']
              format: date-time
              description: 점유 루프가 마지막으로 한 바퀴를 시작한 시각. 큐가 비어 있어도 갱신된다.
            lastPollAgeSeconds:
              type: [integer, 'null']
              minimum: 0
            claimFailureStreak:
              type: integer
              minimum: 0
              description: 점유가 연속으로 실패한 횟수.
            pollLoopCrashed:
              type: boolean
              description: 점유 루프가 예외로 끝났다. 프로세스는 정상 종료 경로를 거쳐 종료 코드 70으로 끝난다.
        filePoller:
          type: object
          description: 운영자 토큰이 있을 때만 반환한다. 파일 채널이 꺼져 있으면 `enabled`가 false뿐이다.
          required: [enabled]
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            running:
              type: boolean
            callers:
              type: integer
              minimum: 0
            lastPollAt:
              type: [string, 'null']
              format: date-time
            lastPollOk:
              type: [boolean, 'null']
    ValidationErrorItem:
      type: object
      description: |
        필드 하나의 검증 실패. 요청에서 받은 값을 되돌려 주지 않는다.
        위치와 고정 코드만 담는다.
      required: [code]
      additionalProperties: false
      properties:
        pointer:
          type: string
          description: |
            본문 필드의 JSON Pointer(RFC 6901). 예 `/to/0`, `/content`.
            빈 문자열은 본문 전체다. 정의되지 않은 필드(`UNKNOWN_FIELD`)는 필드 이름을 되돌려 주지 않으므로 빈 문자열을 쓴다.
        parameter:
          type: string
          description: 헤더나 쿼리 파라미터 이름. 예 `Idempotency-Key`, `after`.
        code:
          type: string
          enum:
            - REQUIRED
            - INVALID_FORMAT
            - TOO_LONG
            - TOO_MANY
            - TOO_LARGE
            - CONTROL_CHARACTER
            - UNKNOWN_FIELD
            - ATTACHMENTS_NOT_SUPPORTED
            - CONFLICTING_FIELDS
            - DECRYPTION_FAILED
            - KID_UNKNOWN
            - CALLER_MISMATCH
            - FROM_NOT_ALLOWED
            - RECIPIENT_DOMAIN_NOT_ALLOWED
            - OUT_OF_RANGE
          description: |
            값 이름은 추정이다.

            - `CONTROL_CHARACTER`: 제목이나 주소에 CR·LF가 있다.
            - `TOO_LARGE`: 복호화 뒤 제목+text+html 합이 1 MiB를 넘는다. 원시 크기 초과는 413이다.
            - `CONFLICTING_FIELDS`: `content`와 `subject`·`text`·`html`을 함께 보냈다.
            - `DECRYPTION_FAILED`: JWE 복호화나 인증에 실패했다. 원인을 더 구분하지 않는다. 알 수 없는 `alg`·`enc`, 보호 헤더·암호문 변조, 키 불일치를 포함한다.
            - `KID_UNKNOWN`: JWE `kid`에 맞는 Mailo 개인키가 없거나 `kid`가 없다. Mailo에 JWE 개인키를 설정하지 않은 배치도 같다.
            - `CALLER_MISMATCH`: 복호화에 성공한 JWE의 `caller`가 인증된 호출처와 다르다.
            - `FROM_NOT_ALLOWED`: 요청의 `from`이 호출처의 허용 발신 주소(호출처 SMTP 계정의 기본 발신 주소 + 호출처 `allowedFrom`)가 아니다. 위치는 `/from`이다. 이미 등록된 Key의 재전송에는 나오지 않는다.
            - `RECIPIENT_DOMAIN_NOT_ALLOWED`: 수신자(`to`·`cc`·`bcc`)의 도메인이 호출처의 `allowedRecipientDomains`에 없다(ADR-0011 결정 8). 어긴 주소마다 한 항목이고 위치는 `/to/0`, `/cc/1`, `/bcc/0` 형식이다. 하나라도 어기면 요청 전체를 거부한다. 도메인은 `@` 뒤를 소문자로 바꿔 정확히 비교한다(하위 도메인은 따로 허용해야 한다). `replyTo`는 제한하지 않는다. 응답에 주소와 도메인 값을 넣지 않는다. 이미 등록된 Key의 재전송에는 나오지 않는다.
            - `OUT_OF_RANGE`: 정수지만 허용 범위 밖이다. 현재는 `ttlSeconds`(60 이상 서버 상한 이하)에만 쓴다. 응답에 요청 값과 상한 값을 넣지 않는다.
    Problem:
      type: object
      description: |
        RFC 9457 problem details. 미디어 타입은 `application/problem+json`이다.

        본문 노출 금지 규칙.

        - `title`은 `type`마다 고정된 문구다. 요청의 제목, 본문, 수신자 값으로 만들지 않는다.
        - `detail`과 `errors`에 요청에서 받은 값(제목, text, html, 암호문, 복호화 평문, 주소, Key)을 넣지 않는다.
        - 위치는 `pointer`나 `parameter`로, 원인은 고정 `code`로만 알린다.
        - 서버 로그와 거부 기록도 같은 규칙을 따른다(RQ-027).
        - 클라이언트는 `type`으로 분기하고 `title`과 `detail`은 사람이 읽는 용도로만 쓴다.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          enum:
            - urn:mailo:problem:malformed-request
            - urn:mailo:problem:validation-failed
            - urn:mailo:problem:unauthorized
            - urn:mailo:problem:forbidden
            - urn:mailo:problem:not-found
            - urn:mailo:problem:idempotency-conflict
            - urn:mailo:problem:job-not-cancelable
            - urn:mailo:problem:cursor-expired
            - urn:mailo:problem:payload-too-large
            - urn:mailo:problem:unsupported-media-type
            - urn:mailo:problem:service-unavailable
          description: |
            문제 유형. 역참조할 문서가 없는 URN을 쓴다(추정).

            | type | status |
            | ---- | ------ |
            | `malformed-request` | 400, JSON 구문 오류 |
            | `validation-failed` | 400, 스키마·입력 검증·헤더·파라미터 오류 |
            | `unauthorized` | 401 |
            | `forbidden` | 403, 읽기 토큰으로 `/ops`의 변경 endpoint를 호출 |
            | `not-found` | 404 |
            | `idempotency-conflict` | 409 |
            | `job-not-cancelable` | 409, `SENDING`이거나 종결된 작업의 취소 |
            | `cursor-expired` | 410, `GET /events?onGap=error`에서 `after` 뒤의 이벤트가 삭제됨 |
            | `payload-too-large` | 413 |
            | `unsupported-media-type` | 415 |
            | `service-unavailable` | 503 |
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
          description: 요청 단위 식별자 `urn:uuid:<요청 ID>`(추정). 서버 로그에 같은 값이 남아 문의할 때 쓴다.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
          description: '`validation-failed`일 때만 있다.'
    PauseScope:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [all, caller, account]
        id:
          type: string
          description: '`type`이 `caller`이면 호출처 ID, `account`이면 SMTP 계정 ID다. `all`이면 없다.'
      description: 발송 정지 범위(ADR-0011 결정 2, ADR-0013 결정 5).
    PauseChange:
      type: object
      required: [scope, paused, changed]
      additionalProperties: false
      properties:
        scope:
          $ref: '#/components/schemas/PauseScope'
        paused:
          type: boolean
          description: 요청 처리 뒤의 정지 상태. PUT은 항상 `true`, DELETE는 항상 `false`다.
        changed:
          type: boolean
          description: 이번 요청이 상태를 바꿨다. 이미 그 상태였으면 `false`이고 감사 기록을 쓰지 않았다.
        pausedAt:
          type: string
          format: date-time
          description: 정지 상태일 때만 있다. 처음 정지한 시각(DB 시각).
        pausedBy:
          type: string
          description: 정지 상태일 때만 있다. 처음 정지한 관리 토큰 이름.
        inRegistry:
          type: boolean
          description: '`scope.type`이 `caller`일 때만 있다. 호출처 ID가 레지스트리에 있다. `false`면 오타일 수 있다.'
        inConfig:
          type: boolean
          description: '`scope.type`이 `account`일 때만 있다. 계정 ID가 이 인스턴스의 계정 구성에 있다. `false`면 오타이거나 구성에서 뺀 계정이다.'
    PauseList:
      type: object
      required: [pauses]
      additionalProperties: false
      properties:
        pauses:
          type: array
          items:
            type: object
            required: [scope, pausedAt, pausedBy]
            additionalProperties: false
            properties:
              scope:
                $ref: '#/components/schemas/PauseScope'
              pausedAt:
                type: string
                format: date-time
              pausedBy:
                type: string
    OpsJob:
      type: object
      description: |
        운영자 읽기의 작업. `Job`에서 `idempotencyKey`와 `rejectedRecipients`를 빼고 `callerId`와 `accountId`를 더했다. 나머지 필드는 `Job`의 같은 이름 필드와 같다.
        호출처가 정한 Key와 거부된 수신자 주소(`rejectedRecipients`)는 운영자 읽기에도 주지 않는다. 본문과 수신자는 없다.
      required:
        - jobId
        - callerId
        - accountId
        - status
        - priority
        - attempts
        - createdAt
        - expiresAt
        - sentAt
        - failedAt
        - failureReason
        - canceledAt
        - canceledBy
        - lastError
        - outcomeUncertain
      additionalProperties: false
      properties:
        callerId:
          type: string
          description: 작업의 호출처.
        accountId:
          type: string
          description: 작업이 등록 때 고정한 SMTP 계정 ID(ADR-0013 결정 2). 호출처 응답(`Job`)에는 없다. 구성에서 빠진 계정이어도 작업에 남아 있는 값이다.
        jobId:
          $ref: '#/components/schemas/Job/properties/jobId'
        status:
          $ref: '#/components/schemas/Job/properties/status'
        priority:
          $ref: '#/components/schemas/Job/properties/priority'
        attempts:
          $ref: '#/components/schemas/Job/properties/attempts'
        createdAt:
          $ref: '#/components/schemas/Job/properties/createdAt'
        expiresAt:
          $ref: '#/components/schemas/Job/properties/expiresAt'
        sentAt:
          $ref: '#/components/schemas/Job/properties/sentAt'
        failedAt:
          $ref: '#/components/schemas/Job/properties/failedAt'
        failureReason:
          $ref: '#/components/schemas/Job/properties/failureReason'
        canceledAt:
          $ref: '#/components/schemas/Job/properties/canceledAt'
        canceledBy:
          $ref: '#/components/schemas/Job/properties/canceledBy'
        lastError:
          $ref: '#/components/schemas/Job/properties/lastError'
        outcomeUncertain:
          $ref: '#/components/schemas/Job/properties/outcomeUncertain'
    AccountStatus:
      type: object
      description: SMTP 계정 하나의 운영 상태. 호스트·사용자·발신 주소·비밀 정보는 없다(RQ-027).
      required: [accountId, breaker, paused, sendQuota24h, queue]
      additionalProperties: false
      properties:
        accountId:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
        breaker:
          type: object
          description: 이 계정의 차단기. `/health/ready`의 인증된 `circuitBreaker`와 같은 값이다.
          required: [state, openUntil, lastReason]
          additionalProperties: false
          properties:
            state:
              type: string
              enum: [closed, open, half_open]
            openUntil:
              type: [string, 'null']
              format: date-time
              description: '`open`일 때만 값이 있다.'
            lastReason:
              type: [string, 'null']
              enum: [AUTH_FAILED, TLS_FAILED, CONNECTION_FAILED, QUOTA_DAILY, QUOTA_BURST, OTHER, null]
              description: '`closed`이면 `null`이다.'
        paused:
          type: boolean
          description: 이 계정의 발송 정지 여부(전체 정지·호출처 정지는 반영하지 않는다).
        sendQuota24h:
          type: [object, 'null']
          description: 24시간 발송 할당. 한도를 설정하지 않은 계정은 `null`이다.
          required: [limit, used]
          additionalProperties: false
          properties:
            limit:
              type: integer
              minimum: 1
            used:
              type: integer
              minimum: 0
              description: 최근 24시간 시도 수(한도에서 멈춘 값)와 점유 중 수의 합. 한도를 넘을 수 있다.
        queue:
          type: object
          required: [dueCount, dueCountTruncated, oldestDueAgeSeconds]
          additionalProperties: false
          properties:
            dueCount:
              type: integer
              minimum: 0
              maximum: 10000
            dueCountTruncated:
              type: boolean
            oldestDueAgeSeconds:
              type: [integer, 'null']
              minimum: 0
    AccountList:
      type: object
      required: [accounts]
      additionalProperties: false
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountStatus'
    AuditEntry:
      type: object
      required: [id, at, actor, action]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
          description: 감사 행 ID. 64비트 정수라서 문자열이다. 클수록 최근이다.
        at:
          type: string
          format: date-time
        actor:
          type: string
          description: 관리 토큰 이름. 토큰 값이 아니다.
        action:
          type: string
          enum: [PAUSE, RESUME, CANCEL_JOB]
        scope:
          $ref: '#/components/schemas/PauseScope'
        jobId:
          type: string
          format: uuid
          description: '`CANCEL_JOB`일 때만 있다.'
    AuditPage:
      type: object
      required: [entries, nextBefore]
      additionalProperties: false
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        nextBefore:
          type: [string, 'null']
          description: 다음 쪽을 읽을 `before` 값. 더 오래된 항목이 없으면 `null`이다.
    JobNotCancelableProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [jobStatus]
          properties:
            jobStatus:
              allOf:
                - $ref: '#/components/schemas/JobStatus'
              description: |
                작업의 현재 상태. `SENDING`, `SENT`, `FAILED`, `EXPIRED` 중 하나다. 취소 요청이 만든 값이 아니다.
                RFC 9457의 `status`(HTTP 상태 코드)와 이름을 구분했다.
    IdempotencyConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
