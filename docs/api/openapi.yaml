openapi: 3.1.0
info:
  title: Mailo REST API
  version: 0.5.0
  summary: Mailo 1단계 REST API 계약 (초안)
  description: |
    Mailo는 Gmail·Google Workspace SMTP로 이메일을 비동기 발송하는 독립 서비스다.
    이 문서는 1단계 REST 계약이다. 근거는 ADR-0001~0008과 요구사항 RQ-001~032이다.
    ADR에 없던 결정은 `docs/api/README.md`의 "계약에서 새로 정한 것" 절에 모았다.
    JWS 서명·JWE 암호화 구현을 서버 없이 확인하는 골든 벡터는 `docs/api/conformance/`다(`docs/api/README.md`의 "프로토콜 적합성 벡터" 절).

    계약 요약.

    - 모든 업무 endpoint는 `Authorization: Bearer <API 키>`를 요구한다. 헬스 endpoint는 예외다.
    - 발송 등록은 `Idempotency-Key`가 필수다. 유일성 범위는 `(caller_id, Idempotency-Key)`다.
    - 같은 Key와 같은 내용은 200, 같은 Key와 다른 내용은 409다.
    - `SENT`는 SMTP 서버의 수락을 뜻한다. 수신자 받은편지함 도착을 뜻하지 않는다.
    - 발송은 at-least-once다. SMTP 수락 직후 장애가 나면 같은 메일이 두 번 갈 수 있다(RQ-013).
    - 모든 오류 응답은 `application/problem+json`(RFC 9457)이다.
    - 오류 응답, 로그, 거부 기록에는 제목, text, html, 암호문과 요청 값을 넣지 않는다.
    - 첨부파일은 지원하지 않는다. 정의되지 않은 필드(`attachments` 포함)는 400이다.
    - 호출처는 모르는 이벤트 `type`과 모르는 `Job.status`를 무시하거나 성공으로 처리하지 않고, 해당 작업을 `GET /jobs`로 확인할 때까지 미종결로 둔다. 모르는 응답 필드는 무시한다. 이 계약의 enum과 `additionalProperties`는 지금 닫혀 있지만 이후 버전이 값과 필드를 더할 수 있다. `outcomeUncertain`(ADR-0011 결정 5)과 `JOB_*` 이벤트의 `recipientsRedacted`(ADR-0015 결정 3)가 이 규칙으로 더한 필드다. `Job`·`OpsJob`은 `additionalProperties: false`이므로 필드 추가는 응답 계약 변경이다. 규칙은 `docs/api/README.md`의 "호출처가 모르는 값을 만났을 때" 절이다.
servers:
  - url: https://mailo.example.internal
    description: 운영 (호스트명은 자리표시자, 추정)
  - url: http://localhost:3000
    description: 개발 (포트는 추정)
tags:
  - name: Jobs
    description: 발송 등록, 작업 조회, 작업 취소
  - name: Events
    description: 종결 이벤트 피드 (pull)
  - name: Health
    description: 생존·준비 상태. 인증 없이 호출할 수 있다.
  - name: Metrics
    description: Prometheus 텍스트 형식 지표. 읽기 토큰만 받는다(관리 토큰은 403). 호출처 API 키로는 호출할 수 없다.
  - name: Ops
    description: 운영 REST. 발송 정지·재개, 관리 취소, 정지·감사 조회. 호출처 API 키로는 호출할 수 없고 운영 토큰(읽기·관리)을 쓴다.
security:
  - bearerAuth: []
paths:
  /jobs:
    post:
      tags: [Jobs]
      operationId: createJob
      summary: 발송 요청 등록
      description: |
        발송 요청을 큐에 등록한다. SMTP 전송 완료를 기다리지 않는다(RQ-007).

        - 새 작업이면 202와 작업을 반환한다. 상태는 `PENDING`이다.
        - 같은 `(caller_id, Idempotency-Key)`가 있고 내용이 같으면 200과 기존 작업을 반환한다.
        - 같은 Key에 내용이 다르면 409다. 두 번째 메일은 등록하지 않는다.
        - 내용 동일 여부는 복호화 뒤 평문의 지문으로 판정한다(ADR-0005 결정 3). 암호문은 비교하지 않는다.
        - 지문 범위는 to, cc, bcc, from, replyTo, subject, text, html, priority, ttlSeconds, onUncertainOutcome이다. 재시도할 때 한 필드라도 바꾸면 409다. `priority` 생략과 `NORMAL`은 같은 내용이다(RQ-034). `ttlSeconds` 생략과 기본 TTL 값을 명시한 요청은 다른 내용이다(RQ-039). `onUncertainOutcome` 생략과 `retry` 명시도 다른 내용이다(RQ-073).
        - 평문 모드(`subject`, `text`, `html`)와 암호화 모드(`content`)는 한 요청에서 섞을 수 없다.
        - 암호화 모드는 수신자·발신자를 먼저 검증하고, 복호화한 뒤에 제목·본문을 검증한다(ADR-0008 결정 3). 지문은 그 뒤에 계산한다. 복호화한 제목·본문의 검증 오류 위치는 모두 `/content`다.
        - 원시 요청이 2 MiB를 넘으면 본문을 읽기 전에도 413으로 거부할 수 있다.
        - 응답의 `Location` 헤더는 `GET /jobs/{jobId}` 경로다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRequest'
            examples:
              plain:
                summary: 평문 모드
                value:
                  to: [kim@example.com]
                  cc: [lee@example.com]
                  from: no-reply@example.com
                  replyTo: support@example.com
                  subject: 주문 접수 안내
                  text: 주문이 접수되었습니다.
                  html: <p>주문이 접수되었습니다.</p>
              encrypted:
                summary: 암호화 모드 (JWE compact, 예시 값이며 실제 암호문이 아니다)
                description: |
                  `content`의 protected header 예시는 아래와 같다.
                  `{"alg":"RSA-OAEP-256","enc":"A256GCM","kid":"mailo-2026-11","caller":"billing"}`
                  평문(payload) 예시는 `{"subject":"주문 접수 안내","text":"주문이 접수되었습니다."}`이다.
                value:
                  to: [kim@example.com]
                  content: eyJhbGciOiJSU0EtT0FFUC0yNTYiLCJlbmMiOiJBMjU2R0NNIiwia2lkIjoibWFpbG8tMjAyNi0xMSIsImNhbGxlciI6ImJpbGxpbmcifQ.Qm9ndXNFbmNyeXB0ZWRLZXlFeGFtcGxl.U29tZUl2RXhhbXBs.Qm9ndXNDaXBoZXJ0ZXh0RXhhbXBsZQ.Qm9ndXNUYWdFeGFtcGxlMTIzNDU
              urgent:
                summary: 우선순위 지정 (인증 코드)
                description: '`priority`는 최상위 평문 필드다. 암호화 모드에서도 `content` 바깥에 둔다.'
                value:
                  to: [kim@example.com]
                  subject: 인증 코드
                  text: 인증 코드는 123456입니다.
                  priority: URGENT
              shortTtl:
                summary: 요청별 만료 시간 지정 (인증 코드, 10분)
                description: |
                  `ttlSeconds`는 최상위 평문 정수다. 만료 시각은 Mailo가 등록 때 DB 시각에 더해 정한다(RQ-039).
                  범위는 60 이상 서버 상한(`MAILO_JOB_EXPIRY_MAX_SECONDS`, 기본은 기본 TTL과 같음) 이하다.
                value:
                  to: [kim@example.com]
                  subject: 인증 코드
                  text: 인증 코드는 123456입니다.
                  priority: URGENT
                  ttlSeconds: 600
              failOnUncertain:
                summary: 결과 불명이면 재시도하지 않는 요청 (인증 코드)
                description: |
                  `onUncertainOutcome`은 최상위 평문 필드다. 암호화 모드에서도 `content` 바깥에 둔다(RQ-073).
                  `fail`이면 메일이 나갔는지 알 수 없는 시도 뒤에 재시도하지 않고 `FAILED`와 `failureReason` `OUTCOME_UNKNOWN`으로 끝낸다.
                  정확히 한 번 보내는 보장이 아니다. 아래 `SendRequest.onUncertainOutcome`의 한계를 읽는다.
                value:
                  to: [kim@example.com]
                  subject: 인증 코드
                  text: 인증 코드는 123456입니다.
                  onUncertainOutcome: fail
      responses:
        '202':
          description: 새 작업을 등록했다. relay는 완료로 처리한다.
          headers:
            Location:
              $ref: '#/components/headers/JobLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                created:
                  $ref: '#/components/examples/JobPending'
        '200':
          description: 같은 Key와 같은 내용의 요청이 이미 있다. 기존 작업과 현재 상태를 반환한다. relay는 완료로 처리한다.
          headers:
            Location:
              $ref: '#/components/headers/JobLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                duplicateSent:
                  $ref: '#/components/examples/JobSent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 같은 Key에 다른 내용이 왔다. relay는 재시도하지 않고 영구 실패로 기록하며 운영 알림을 낸다.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/IdempotencyConflictProblem'
              examples:
                conflict:
                  summary: 같은 Key, 다른 내용
                  value:
                    type: urn:mailo:problem:idempotency-conflict
                    title: Idempotency-Key conflict
                    status: 409
                    detail: 같은 Idempotency-Key로 다른 내용의 요청이 이미 등록되어 있다.
                    instance: urn:uuid:5f1c2d9e-7a4b-4d1e-9a52-0c3b8f6e2a10
                    jobId: 3f0e9a52-6b1d-4c8e-9f27-1a5d7c4b8e90
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [Jobs]
      operationId: getJobByIdempotencyKey
      summary: Idempotency-Key로 작업 조회
      description: |
        등록된 작업만 반환한다. 파일 채널 호출처는 작업 ID를 받지 못하므로 이 조회를 쓴다(ADR-0006 결정 1).

        - 목록이 아니라 작업 하나를 반환한다.
        - 등록되지 않은 Key, 보존 기간(종결 후 30일)이 지나 삭제된 Key, 다른 호출처의 Key는 모두 404다.
        - 수집 거부와 지문 불일치는 작업으로 남지 않는다. 404이면 이벤트 피드에서 같은 Key의 `INTAKE_REJECTED`를 찾는다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyQuery'
      responses:
        '200':
          description: 작업을 반환한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                retryWait:
                  $ref: '#/components/examples/JobRetryWait'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /jobs/{jobId}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: 작업 ID로 작업 조회
      description: |
        존재하지 않는 ID와 다른 호출처의 작업은 모두 404다.
        본문은 응답에 포함하지 않는다. 종결 때 DB에서도 삭제된다.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: 작업을 반환한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                sent:
                  $ref: '#/components/examples/JobSent'
                failed:
                  $ref: '#/components/examples/JobFailed'
                failedOutcomeUncertain:
                  $ref: '#/components/examples/JobFailedUncertain'
                failedOutcomeUnknown:
                  $ref: '#/components/examples/JobFailedOutcomeUnknown'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /jobs/cancel:
    post:
      tags: [Jobs]
      operationId: cancelJobByIdempotencyKey
      summary: Idempotency-Key로 작업 취소
      description: |
        호출처 자신의 대기 작업을 취소한다(RQ-040, ADR-0011 결정 4). 작업 ID를 받지 못하는 파일 채널 호출처가 쓴다(ADR-0006 결정 1과 같은 이유).
        요청 본문은 없다. 보내도 읽지 않는다. 동작은 `POST /jobs/{jobId}/cancel`과 같다.

        - 등록되지 않은 Key, 보존 기간이 지나 삭제된 Key, 다른 호출처의 Key는 모두 404다.
        - 취소된 작업의 Key로 같은 내용을 다시 `POST /jobs`로 보내면 200과 `CANCELED` 작업이 온다. 다른 내용이면 409다(RQ-034). 다시 보내려면 새 Key를 쓴다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyQuery'
      responses:
        '200':
          description: 취소했거나 이미 `CANCELED`였다. 현재 작업을 반환한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                canceled:
                  $ref: '#/components/examples/JobCanceled'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/JobNotCancelable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /jobs/{jobId}/cancel:
    post:
      tags: [Jobs]
      operationId: cancelJob
      summary: 작업 ID로 작업 취소
      description: |
        호출처 자신의 대기 작업을 취소한다(RQ-040, ADR-0011 결정 4). 요청 본문은 없다. 보내도 읽지 않는다.

        - `PENDING`과 `RETRY_WAIT`만 `CANCELED`로 바꾼다. `SENDING`은 취소하지 않는다. 진행 중인 전송을 중단하지 않는다.
        - 취소하면 200과 `CANCELED` 작업을 반환한다. 이미 `CANCELED`이면 이벤트를 새로 쓰지 않고 같은 200을 반환한다(멱등).
        - `SENDING`, `SENT`, `FAILED`, `EXPIRED`이면 409(`job-not-cancelable`)이고 작업은 바뀌지 않는다. 응답의 `jobStatus`가 현재 상태다.
        - `claim`과 겹치면 한쪽만 이긴다. 취소가 늦으면 작업이 이미 `SENDING`이어서 409이고 메일이 나갈 수 있다.
        - 취소 즉시 DB의 본문을 지운다. 행, Key, 지문은 보존 기간(종결 후 30일)까지 남는다.
        - 취소는 호출처의 `JOB_CANCELED` 이벤트를 남긴다. 호출처가 직접 취소해도 쓴다.
        - 다른 호출처의 작업과 없는 작업은 구분하지 않고 404다.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: 취소했거나 이미 `CANCELED`였다. 현재 작업을 반환한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                canceled:
                  $ref: '#/components/examples/JobCanceled'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/JobNotCancelable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /ops/accounts:
    get:
      tags: [Ops]
      operationId: listAccounts
      summary: SMTP 계정별 운영 상태
      description: |
        이 인스턴스가 구성한 SMTP 계정마다 차단기 상태, 발송 정지 여부, 24시간 사용량·한도, 점유 대상 작업 적체를 반환한다(RQ-060, ADR-0013 결정 5).
        읽기 토큰과 관리 토큰을 받는다. 호출처 API 키는 401이다. 구성 순서(`default`, 계정 파일 순서)다.

        - SMTP 호스트, 사용자, 발신 주소, 비밀번호, 비밀 변수 이름은 담지 않는다. 계정은 구성한 ID로만 나온다.
        - 구성에서 빠진 계정은 목록에 없다. 그 계정에 남은 작업은 점유되지 않고 `expiresAt`에 `EXPIRED`가 된다. 구성에 없는 계정의 정지 행은 `GET /ops/pauses`에 있다.
        - `breaker`의 모양과 값은 `/health/ready`의 인증된 `circuitBreaker`와 같다. 계정마다 독립이다.
        - `sendQuota24h`는 한도(`sendQuota24h`)를 설정한 계정만 값이 있고 나머지는 `null`이다. `used`는 한도를 넘을 수 있다(점유 중 작업을 더한다).
        - `queue`는 그 계정의 적체이고 `dueCount`는 상한 10000에서 멈춘다(`dueCountTruncated`). 항목마다 따로 읽으므로 한 시점의 스냅샷은 아니다.
      security:
        - opsReadAuth: []
      responses:
        '200':
          description: 계정 목록.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
              examples:
                twoAccounts:
                  value:
                    accounts:
                      - accountId: default
                        breaker: { state: closed, openUntil: null, lastReason: null }
                        paused: false
                        sendQuota24h: null
                        queue: { dueCount: 3, dueCountTruncated: false, oldestDueAgeSeconds: 12 }
                      - accountId: marketing
                        breaker: { state: open, openUntil: '2026-11-24T10:30:00Z', lastReason: QUOTA_DAILY }
                        paused: false
                        sendQuota24h: { limit: 400, used: 401 }
                        queue: { dueCount: 120, dueCountTruncated: false, oldestDueAgeSeconds: 1800 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /ops/pauses:
    get:
      tags: [Ops]
      operationId: listPauses
      summary: 발송 정지 목록
      description: |
        현재 걸려 있는 발송 정지를 정지 시각 순서로 반환한다(RQ-043, ADR-0011 결정 7). 읽기 토큰과 관리 토큰을 받는다.
        정지가 없으면 빈 배열이다. 호출처 API 키는 401이다.
      security:
        - opsReadAuth: []
      responses:
        '200':
          description: 정지 목록.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PauseList'
              examples:
                paused:
                  value:
                    pauses:
                      - scope: { type: caller, id: billing }
                        pausedAt: '2026-11-24T09:12:00Z'
                        pausedBy: oncall
                      - scope: { type: all }
                        pausedAt: '2026-11-24T09:30:00Z'
                        pausedBy: oncall
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /ops/pauses/all:
    put:
      tags: [Ops]
      operationId: pauseAll
      summary: 전체 발송 정지
      description: |
        모든 호출처의 점유를 멈춘다(RQ-043, ADR-0011 결정 2). 관리 토큰만 받는다. 요청 본문은 없다.

        - 점유 경로 두 개(일반 점유와 차단기 대표 작업 점유)가 모두 멈춘다.
        - 이미 `SENDING`인 작업의 전송은 끝까지 가고 결과도 기록한다. 정지 응답 직후에도 인스턴스 수 × 동시 전송 수(`MAILO_WORKER_CONCURRENCY`) 이하의 작업이 점유를 마친 상태로 남을 수 있다(정지 명령이 커밋되기 전에 정지를 읽은 점유).
        - lease 복구, 결과 기록, 만료 sweep, 본문·기록 삭제와 등록(REST·파일)은 계속한다. 정지 중에도 `expiresAt`은 흐르므로 긴 정지는 `EXPIRED`를 만든다.
        - 이미 정지 상태면 아무것도 바꾸지 않고 `changed: false`와 처음 정지의 시각·이름을 반환한다(멱등). 감사 기록은 상태를 바꾼 요청만 쓴다.
        - 정지는 차단기와 독립이다. 정지를 풀어도 차단기 상태는 바뀌지 않는다.
        - 롤링 배포 중(구·신 인스턴스 혼용)에는 쓰지 않는다. 구버전 인스턴스는 정지를 읽지 않는다.
      security:
        - opsAdminAuth: []
      responses:
        '200':
          $ref: '#/components/responses/PauseChanged'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Ops]
      operationId: resumeAll
      summary: 전체 발송 재개
      description: |
        전체 정지를 푼다. 관리 토큰만 받는다. 정지가 없으면 `changed: false`다(멱등, 감사 기록 없음).
        호출처 정지(`/ops/pauses/callers/{callerId}`)는 이 요청이 풀지 않는다.
      security:
        - opsAdminAuth: []
      responses:
        '200':
          $ref: '#/components/responses/PauseChanged'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /ops/pauses/callers/{callerId}:
    put:
      tags: [Ops]
      operationId: pauseCaller
      summary: 호출처 발송 정지
      description: |
        한 호출처의 작업만 점유에서 뺀다(RQ-043, ADR-0011 결정 3). 관리 토큰만 받는다. 다른 호출처는 영향이 없다.

        - `callerId`는 호출처 ID 형식(`^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$`)이어야 한다. 틀리면 400이다.
        - 레지스트리에 있는지 확인하지 않는다. 레지스트리에서 뺀 호출처의 남은 작업도 멈추기 위해서다. 응답의 `inRegistry`로 오타를 알아본다.
        - 정지한 호출처의 등록은 계속 받는다. 작업은 `PENDING`에 쌓이고 `expiresAt`에 `EXPIRED`가 된다. 새 요청 자체를 막으려면 API 키를 폐기한다.
        - 정지한 호출처는 호출처별 24시간 할당 계산에서도 빠진다.
        - 멱등이다. 이미 정지면 `changed: false`다.
      security:
        - opsAdminAuth: []
      parameters:
        - $ref: '#/components/parameters/CallerIdPath'
      responses:
        '200':
          $ref: '#/components/responses/PauseChanged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Ops]
      operationId: resumeCaller
      summary: 호출처 발송 재개
      description: |
        호출처 정지를 푼다. 관리 토큰만 받는다. 정지가 없으면 `changed: false`다(멱등, 감사 기록 없음).
      security:
        - opsAdminAuth: []
      parameters:
        - $ref: '#/components/parameters/CallerIdPath'
      responses:
        '200':
          $ref: '#/components/responses/PauseChanged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /ops/pauses/accounts/{accountId}:
    put:
      tags: [Ops]
      operationId: pauseAccount
      summary: SMTP 계정 발송 정지
      description: |
        한 SMTP 계정의 점유를 멈춘다(RQ-061, ADR-0013 결정 5). 관리 토큰만 받는다. 다른 계정은 영향이 없다. 요청 본문은 없다.

        - `accountId`는 계정 ID 형식(`^[a-z0-9][a-z0-9_-]{0,31}$`, `unregistered`는 예약어)이어야 한다. 틀리면 400(`accountId`, `INVALID_FORMAT`)이다.
        - 구성에 있는지 확인하지 않는다. 구성에서 뺀 계정의 정지 행을 정리할 수 있어야 해서다. 응답의 `inConfig`로 오타를 알아본다.
        - 정지한 계정의 점유가 멈춘다(차단기 대표 작업 포함). 그 계정을 쓰는 호출처의 등록은 계속 받고 작업은 `PENDING`에 쌓이다 `expiresAt`에 `EXPIRED`가 된다.
        - 정지는 차단기와 독립이다. 정지를 풀어도 차단기 상태는 바뀌지 않는다. 전체 정지·호출처 정지와 합쳐서 적용된다.
        - 진행 중 전송(`SENDING`)은 끝까지 가고 결과를 기록한다.
        - 멱등이다. 이미 정지면 `changed: false`이고 감사 기록을 쓰지 않는다. 감사는 `scope.type: account`로 남는다.
        - 롤링 배포 중(구·신 인스턴스 혼용)에는 쓰지 않는다. 구버전 인스턴스는 계정 정지를 읽지 않는다.
      security:
        - opsAdminAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          $ref: '#/components/responses/PauseChanged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Ops]
      operationId: resumeAccount
      summary: SMTP 계정 발송 재개
      description: |
        계정 정지를 푼다. 관리 토큰만 받는다. 정지가 없으면 `changed: false`다(멱등, 감사 기록 없음). 구성에 없는 계정 ID도 받는다.
      security:
        - opsAdminAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          $ref: '#/components/responses/PauseChanged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /ops/jobs/{jobId}:
    get:
      tags: [Ops]
      operationId: getJobAsOperator
      summary: 작업 조회(모든 호출처)
      description: |
        호출처 범위 없이 작업 ID로 조회한다(ADR-0011 결정 7). 읽기 토큰과 관리 토큰을 받는다.
        `GET /jobs/{jobId}`의 `Job`에서 `idempotencyKey`와 `rejectedRecipients`를 빼고 `callerId`와 `accountId`(작업이 등록 때 고정한 SMTP 계정 ID)를 더했다. 호출처가 정한 Key와 거부된 수신자 주소는 운영자 읽기에도 주지 않는다. 수신자와 본문은 없다.
        없거나 보존 기간이 지나 삭제된 작업은 404다.
      security:
        - opsReadAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: 작업.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /ops/jobs/{jobId}/cancel:
    post:
      tags: [Ops]
      operationId: cancelJobAsOperator
      summary: 작업 취소(모든 호출처)
      description: |
        호출처 범위 없이 대기 작업을 취소한다(RQ-044, ADR-0011 결정 4). 관리 토큰만 받는다. 요청 본문은 없다.
        동작은 `POST /jobs/{jobId}/cancel`과 같고 `canceledBy`가 `OPERATOR`다. 호출처 피드에 `JOB_CANCELED`가 한 건 생긴다(운영자 이름은 없다).

        - 새로 취소한 요청만 같은 트랜잭션에 감사 기록(`CANCEL_JOB`, 토큰 이름, 작업 ID)을 쓴다. 이미 `CANCELED`이면 200이고 이벤트·감사를 새로 쓰지 않는다(멱등).
        - `SENDING`, `SENT`, `FAILED`, `EXPIRED`이면 409(`job-not-cancelable`)이고 `jobStatus`가 현재 상태다. 감사 기록은 없다.
        - 호출처가 바라지 않은 `CANCELED`를 만들 수 있다. 호출처가 모르는 값 규칙을 지키는지 확인한 뒤 관리 토큰을 설정한다(`docs/operations/deployment.md`).
      security:
        - opsAdminAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: 취소했거나 이미 `CANCELED`였다. 현재 작업을 반환한다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/JobNotCancelable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /ops/audit:
    get:
      tags: [Ops]
      operationId: listAudit
      summary: 관리 작업 감사 목록
      description: |
        관리 토큰으로 상태를 바꾼 작업(`PAUSE`, `RESUME`, `CANCEL_JOB`)의 기록을 최근 순서로 반환한다(RQ-044, ADR-0011 결정 6·7). 읽기 토큰과 관리 토큰을 받는다.
        항목은 토큰 이름, 동작, 범위, 작업 ID, 시각뿐이다. 사유·메모 같은 자유 텍스트는 없다. 수신자와 본문도 없다.
        다음 쪽은 응답의 `nextBefore`를 `before`로 보낸다. 마지막 쪽은 `nextBefore`가 `null`이다.
      security:
        - opsReadAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: 한 번에 반환하는 최대 항목 수. 기본 50, 최대 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: before
          in: query
          required: false
          description: 이전 응답의 `nextBefore`. 이 id보다 작은 항목을 반환한다. 양의 64비트 정수의 십진 문자열이다.
          schema:
            type: string
            pattern: '^[1-9][0-9]{0,18}$'
      responses:
        '200':
          description: 감사 항목.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
              examples:
                page:
                  value:
                    entries:
                      - id: '12'
                        at: '2026-11-24T09:35:00Z'
                        actor: deploy
                        action: CANCEL_JOB
                        jobId: 3f0e9a52-6b1d-4c8e-9f27-1a5d7c4b8e90
                      - id: '11'
                        at: '2026-11-24T09:30:00Z'
                        actor: oncall
                        action: PAUSE
                        scope: { type: all }
                    nextBefore: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: 종결 이벤트 피드 조회
      description: |
        호출처 자신의 종결 이벤트와 수집 거부 이벤트를 cursor 순서로 반환한다(ADR-0006 결정 2).

        사용법.

        1. 처음에는 `after` 없이 호출한다.
        2. 응답의 `nextCursor`를 저장하고 다음 호출의 `after`로 쓴다.
        3. `hasMore`가 `true`이면 바로 이어서 호출한다. `false`이면 권장 간격(30초, 추정)으로 폴링한다.

        주의.

        - 같은 이벤트가 다시 올 수 있다. `eventId`로 멱등하게 처리한다.
        - 빈 `events`는 새 이벤트가 없다는 뜻이 아니다. DB에 긴 트랜잭션이 있으면 피드가 지연된다. 이벤트는 유실되지 않는다.
        - cursor는 불투명 문자열이다. 해석하거나 만들지 않는다. 형식은 서버가 바꿀 수 있다.
        - cursor는 `type` 필터와 무관하다. 필터를 바꾸면서 같은 cursor를 이어 쓰면 이벤트를 놓칠 수 있다. 필터 조합마다 cursor를 따로 저장한다.
        - 이벤트는 기록 후 30일 보존한다. 30일 넘게 폴링하지 않으면 그 사이 이벤트를 놓친다.

        수신자 비움(RQ-072, ADR-0015 결정 3).

        - `JOB_*` 이벤트의 수신자(`recipients`)와 거부 수신자(`rejectedRecipients`)는 이벤트 기록 후 유예(기본 7일, 운영자가 정한다)가 지나면 서버가 비운다. 이벤트 행은 30일 보존 안에서 그대로이고 `eventId`·순서·cursor도 그대로다.
        - 비운 이벤트는 `recipientsRedacted: true`이고 `recipients`는 `to`·`cc`·`bcc`가 모두 빈 배열이며 `rejectedRecipients`는 빈 배열이다. 비우기 전에는 `false`다. `recipientsRedacted`는 `JOB_*` 이벤트에 항상 있다.
        - 수신자는 유예 안에서만 믿을 수 있다. 상태 판단과 기록에는 `idempotencyKey`로 찾은 호출처 자신의 outbox 행을 쓴다. 비운 값은 복원하지 못한다.

        공백 신호(ADR-0011 결정 9).

        - `after`가 있을 때 그 cursor 뒤에서 보존 기간이 지나 삭제된 이벤트가 있으면 응답에 헤더 `Mailo-Cursor-Gap: true`가 붙는다. 상태는 200이고 본문 형식은 바뀌지 않는다. 모르는 호출처는 헤더를 무시한다.
        - 헤더가 있으면 응답의 이벤트는 정상 처리하고, 종결되지 않은 outbox 행은 `GET /jobs?idempotencyKey=`로 확인한다. 30일이 지나 404인 Key는 호출처가 정한다.
        - 헤더는 삭제 지점이 cursor보다 뒤인 동안 매 응답에 붙는다. `nextCursor`로 이어 읽어 cursor가 삭제 지점을 넘으면 사라진다.
        - 판정은 호출처와 `type`별이다. `type` 필터로 읽으면 요청한 종류의 삭제만 본다. 다른 호출처의 삭제와 cursor 앞의 삭제는 신호가 아니다.
        - 쿼리 파라미터 `onGap=error`를 보내면 공백일 때 헤더 대신 410(`cursor-expired`)이다. 410을 처리할 수 있는 호출처만 쓴다. 410을 받으면 `after` 없이 다시 읽어 남은 이벤트부터 받고 같은 확인을 한다.
        - 한계: 공백 감지를 도입하기 전에 삭제된 이벤트, `after` 없는 읽기(cursor가 `null`이거나 복구 읽기), 롤링 중 구버전 인스턴스가 지운 이벤트는 판정하지 못한다.
      parameters:
        - $ref: '#/components/parameters/EventsAfter'
        - $ref: '#/components/parameters/EventsType'
        - $ref: '#/components/parameters/EventsLimit'
        - $ref: '#/components/parameters/EventsOnGap'
      responses:
        '200':
          description: '이벤트 목록과 다음 cursor. `after` 뒤에서 삭제된 이벤트가 있으면 헤더 `Mailo-Cursor-Gap: true`가 붙는다.'
          headers:
            Mailo-Cursor-Gap:
              $ref: '#/components/headers/CursorGap'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
              examples:
                mixed:
                  summary: 이벤트 종류별 예
                  value:
                    events:
                      - eventId: '1048'
                        type: JOB_SENT
