          category: TRANSIENT
          smtpCode: null
          enhancedCode: null
          occurredAt: '2026-11-23T11:02:10Z'
        outcomeUncertain: true
        rejectedRecipients: []
    JobFailedOutcomeUnknown:
      summary: '`onUncertainOutcome` `fail` 요청이 결과 불명으로 끝났다. 메일이 나갔는지 알 수 없다.'
      value:
        jobId: 7a3c9e51-0d4b-4f82-b6a1-2e8d5c1f9047
        idempotencyKey: outbox-8901
        status: FAILED
        priority: URGENT
        attempts: 1
        createdAt: '2026-11-23T09:40:00Z'
        expiresAt: '2026-11-23T09:50:00Z'
        sentAt: null
        failedAt: '2026-11-23T09:40:35Z'
        failureReason: OUTCOME_UNKNOWN
        canceledAt: null
        canceledBy: null
        lastError:
          category: TRANSIENT
          smtpCode: null
          enhancedCode: null
          occurredAt: '2026-11-23T09:40:35Z'
        outcomeUncertain: true
        rejectedRecipients: []
    ProblemMalformed:
      summary: JSON 구문 오류
      value:
        type: urn:mailo:problem:malformed-request
        title: Malformed request
        status: 400
        detail: 요청 본문을 JSON으로 해석할 수 없다.
        instance: urn:uuid:0b7d3a64-1e2f-4c85-8d9a-4f6e7c1b2a33
    ProblemMissingKey:
      summary: Idempotency-Key 누락
      value:
        type: urn:mailo:problem:validation-failed
        title: Validation failed
        status: 400
        detail: 요청이 검증을 통과하지 못했다.
        instance: urn:uuid:7a2e5c18-3b49-4f06-a1d7-9e8c0b5d4f21
        errors:
          - parameter: Idempotency-Key
            code: REQUIRED
    ProblemInvalidFields:
      summary: 필드 검증 실패 (제목에 CR·LF, 수신자 형식 오류, 첨부 포함)
      value:
        type: urn:mailo:problem:validation-failed
        title: Validation failed
        status: 400
        detail: 요청이 검증을 통과하지 못했다.
        instance: urn:uuid:c91f4e07-5d3a-4b28-8e6c-2a1b0f7d9e45
        errors:
          - pointer: /subject
            code: CONTROL_CHARACTER
          - pointer: /to/1
            code: INVALID_FORMAT
          - pointer: /attachments
            code: ATTACHMENTS_NOT_SUPPORTED
    ProblemDecryptionFailed:
      summary: JWE 복호화 실패. 암호문과 평문을 응답에 넣지 않는다.
      value:
        type: urn:mailo:problem:validation-failed
        title: Validation failed
        status: 400
        detail: 요청이 검증을 통과하지 못했다.
        instance: urn:uuid:e3b0c442-98fc-4c14-9afb-f4c8996fb924
        errors:
          - pointer: /content
            code: DECRYPTION_FAILED
    ProblemInvalidCursor:
      summary: cursor 오류
      value:
        type: urn:mailo:problem:validation-failed
        title: Validation failed
        status: 400
        detail: 요청이 검증을 통과하지 못했다.
        instance: urn:uuid:2c26b46b-68ff-4c3e-b0a5-1d9f0e7a6c58
        errors:
          - parameter: after
            code: INVALID_FORMAT
  responses:
    BadRequest:
      description: |
        Key 누락·형식 위반, 스키마·입력 검증 실패, 복호화 실패, 첨부 포함, 정의되지 않은 필드, JSON 구문 오류.
        relay는 재시도하지 않는다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            malformed:
              $ref: '#/components/examples/ProblemMalformed'
            missingKey:
              $ref: '#/components/examples/ProblemMissingKey'
            invalidFields:
              $ref: '#/components/examples/ProblemInvalidFields'
            decryptionFailed:
              $ref: '#/components/examples/ProblemDecryptionFailed'
            invalidCursor:
              $ref: '#/components/examples/ProblemInvalidCursor'
    Unauthorized:
      description: |
        Authorization 헤더가 없거나, Bearer 형식이 아니거나, 키가 틀렸다. 원인을 구분해 알리지 않는다.
        relay는 재시도하지 않는다. 자격을 고친 뒤 사용처가 재전송 절차를 정한다.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthorized:
              value:
                type: urn:mailo:problem:unauthorized
                title: Unauthorized
                status: 401
                detail: 인증에 실패했다.
                instance: urn:uuid:8f434346-648f-4b8e-a0d1-6e5a7c9b1d02
    PauseChanged:
      description: |
        요청 처리 뒤의 정지 상태. 이미 그 상태였으면 `changed: false`이고 상태·감사 기록을 바꾸지 않는다(멱등).
        정지·감사는 한 트랜잭션이다. 감사 기록이 실패하면 상태도 바뀌지 않고 503이다.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PauseChange'
          examples:
            paused:
              value:
                scope: { type: caller, id: billing }
                paused: true
                changed: true
                pausedAt: '2026-11-24T09:12:00Z'
                pausedBy: oncall
                inRegistry: true
            alreadyResumed:
              value:
                scope: { type: all }
                paused: false
                changed: false
    Forbidden:
      description: |
        읽기 토큰으로 변경 endpoint를 호출했다. 토큰은 유효하지만 관리 권한이 없다. 상태는 바뀌지 않는다.
        `GET /metrics`에서는 반대로 관리 토큰이 거부된다(읽기 토큰만 받는다).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            forbidden:
              value:
                type: urn:mailo:problem:forbidden
                title: Forbidden
                status: 403
                detail: 이 토큰으로는 요청한 동작을 할 수 없다.
                instance: urn:uuid:5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d
    NotFound:
      description: 존재하지 않거나 다른 호출처의 작업이거나 보존 기간이 지나 삭제됐다. 세 경우를 구분하지 않는다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notFound:
              value:
                type: urn:mailo:problem:not-found
                title: Not found
                status: 404
                detail: 해당 작업을 찾을 수 없다.
                instance: urn:uuid:a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
    JobNotCancelable:
      description: |
        작업이 `SENDING`이거나 종결 상태(`SENT`, `FAILED`, `EXPIRED`)라서 취소할 수 없다. 작업은 바뀌지 않는다.
        `jobStatus`가 현재 상태다. 이미 `CANCELED`인 작업은 이 응답이 아니라 200이다.
        relay는 재시도하지 않는다. `SENDING`이면 잠시 뒤 `GET /jobs/{jobId}`로 결과를 확인한다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/JobNotCancelableProblem'
          examples:
            sending:
              value:
                type: urn:mailo:problem:job-not-cancelable
                title: Job not cancelable
                status: 409
                detail: 발송 중이거나 이미 종결된 작업은 취소할 수 없다.
                instance: urn:uuid:4d3c2b1a-0f9e-4d8c-b7a6-5e4f3a2b1c0d
                jobStatus: SENDING
    CursorExpired:
      description: |
        `onGap=error`를 보냈고 `after` 뒤에서 보존 기간이 지나 삭제된 이벤트가 있다. 본문은 고정 문구이고 cursor를 담지 않는다.
        `after` 없이 다시 읽어 남은 이벤트부터 받고, 종결되지 않은 작업은 `GET /jobs?idempotencyKey=`로 확인한다.
        같은 `after`로 `onGap` 없이 다시 읽어도 된다(헤더로 알린다).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            cursorExpired:
              value:
                type: urn:mailo:problem:cursor-expired
                title: Cursor expired
                status: 410
                detail: cursor 뒤에서 보존 기간이 지나 삭제된 이벤트가 있다. after 없이 다시 읽고 종결되지 않은 작업은 GET /jobs로 확인한다.
                instance: urn:uuid:0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
    PayloadTooLarge:
      description: 원시 요청이 2 MiB(추정 기본값)를 넘었다. relay는 재시도하지 않는다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            tooLarge:
              value:
                type: urn:mailo:problem:payload-too-large
                title: Payload too large
                status: 413
                detail: 요청 크기가 상한을 넘었다.
                instance: urn:uuid:f0e1d2c3-b4a5-4968-8776-5a4b3c2d1e0f
    UnsupportedMediaType:
      description: '`Content-Type`이 `application/json`이 아니다(추정). relay는 재시도하지 않는다.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unsupported:
              value:
                type: urn:mailo:problem:unsupported-media-type
                title: Unsupported media type
                status: 415
                detail: Content-Type은 application/json이어야 한다.
                instance: urn:uuid:11223344-5566-4778-8899-aabbccddeeff
    ServiceUnavailable:
      description: |
        DB 장애 등 Mailo 내부 오류. 작업이 반쯤 등록된 상태는 남지 않는다.
        relay는 같은 Key로 재시도한다. 이 문서에 없는 5xx와 네트워크 오류, 타임아웃도 같다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unavailable:
              value:
                type: urn:mailo:problem:service-unavailable
                title: Service unavailable
                status: 503
                detail: 요청을 처리할 수 없다. 같은 Idempotency-Key로 다시 시도한다.
                instance: urn:uuid:99887766-5544-4332-8110-ffeeddccbbaa
