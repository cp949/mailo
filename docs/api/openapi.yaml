          category: PERMANENT
          smtpCode: 550
          enhancedCode: 5.1.1
          occurredAt: '2026-11-23T09:31:40Z'
        outcomeUncertain: false
        rejectedRecipients: []
    JobFailedUncertain:
      summary: 결과 불명 실패. DATA 뒤 연결이 끊긴 시도가 있어 메일이 이미 나갔을 수 있다.
      value:
        jobId: 5d1f0b86-7c2e-4a39-9e84-0b6a2c7d4e15
        idempotencyKey: outbox-8843
        status: FAILED
        priority: NORMAL
