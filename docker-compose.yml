# 상시 서비스는 Mailo와 PostgreSQL 둘뿐이다(RQ-029). 브로커와 메일 서버를 추가하지 않는다.
# 예외: 개발용 Mailpit은 profile mailpit으로만 켜지는 opt-in 서비스다. 기본 기동에 들어가지 않고 운영용이 아니다.
#   docker compose up -d
#   docker compose --profile mailpit up -d   # 개발용 Mailpit 함께 기동(deployment.md "개발용 Mailpit")
# 접속값은 .env(.env.example 복사)에서 읽는다. 시크릿은 이미지에 넣지 않는다(RQ-025).

services:
  postgres:
    # ADR-0006: 13 이상 필수. 16 이상으로 고정해 둔다.
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mailo}
      # 기본값이 없다. .env(.env.example 복사)나 환경에서 반드시 준다. 공개 기본 비밀번호를 두면 DB 포트가 열린 채로 알려진 비밀번호가 남는다.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env나 환경에 설정한다(.env.example 참고)}
      POSTGRES_DB: ${POSTGRES_DB:-mailo}
    ports:
      - "127.0.0.1:${MAILO_DB_PUBLISH_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-mailo} -d ${POSTGRES_DB:-mailo}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 개발용 SMTP 수신 서버(GitHub 이슈 #2). 운영용이 아니다. 받은 메일은 컨테이너 /tmp에만 있고 재시작하면 사라진다.
  # Mailo는 MAILO_SMTP_SECURITY=none, MAILO_SMTP_HOST=mailpit, MAILO_SMTP_PORT=1025로 보낸다(.env.example).
  mailpit:
    # 갱신: docker buildx imagetools inspect axllent/mailpit:<태그>로 index digest를 확인해 태그와 함께 바꾼다.
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    profiles: ["mailpit"]
    environment:
      # .env.example의 가짜 SMTP 사용자·비밀번호를 그대로 둬도 받도록 평문 AUTH를 아무 값으로나 허용한다.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      # 웹 UI·API만 공개한다. SMTP 1025는 compose 네트워크 안에서 mailo만 쓴다.
      - "127.0.0.1:${MAILO_MAILPIT_UI_PORT:-8025}:8025"
    # 이미지 기본 사용자는 root다. 1024 이상 포트만 쓰므로 nobody로 낮춘다.
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  mailo:
    build:
      context: .
    # MAILO_* 설정 전체를 .env에서 받는다(.env.example 참고). 아래 environment가 같은 이름을 덮어쓴다.
    # 운영 토큰(MAILO_OPS_TOKEN, MAILO_OPS_ADMIN_NAMES, MAILO_OPS_ADMIN_TOKEN_<이름>)도 이 경로로 받으므로 이름별 설정을 더하지 않는다.
    # _FILE로 받는 토큰은 파일 마운트를 따로 연다(docs/operations/deployment.md "시크릿 주입").
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      MAILO_PORT: "3000"
      # 접속 URL을 compose가 이어 붙이면 비밀번호의 `@`, `/`, `:`, `#`, `%`에서 URL이 깨진다.
      # 분리 변수를 주면 앱이 사용자·비밀번호·DB 이름을 URL 인코딩해 조립한다.
      # .env의 호스트 실행용 MAILO_DATABASE_URL이 컨테이너로 새지 않게 빈 값으로 덮는다(둘을 함께 주면 기동을 거부한다).
      MAILO_DATABASE_URL: ""
      MAILO_DATABASE_URL_FILE: ""
      MAILO_DB_HOST: postgres
      MAILO_DB_PORT: "5432"
      MAILO_DB_USER: ${POSTGRES_USER:-mailo}
      MAILO_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env나 환경에 설정한다(.env.example 참고)}
      MAILO_DB_NAME: ${POSTGRES_DB:-mailo}
      MAILO_CALLERS_FILE: /run/mailo/callers.json
      # 아래 stop_grace_period와 같은 값을 앱에 알려 기동 때 drain 상한 + 10초 이상인지 검사하게 한다(RQ-025).
      MAILO_STOP_GRACE_PERIOD: ${MAILO_STOP_GRACE_PERIOD:-150s}
    volumes:
      # 호출처 레지스트리(API 키 해시). 파일이 없으면 먼저 callers.example.json을 복사해 만든다.
      - ./callers.json:/run/mailo/callers.json:ro
      # SMTP 계정 파일(ADR-0013): .env에 MAILO_SMTP_ACCOUNTS_FILE=/run/mailo/smtp-accounts.json을 주고 아래 마운트를 연다.
      # 파일에는 비밀번호 값이 없다. 비밀 변수(MAILO_SMTP_SECRET_<이름>)는 .env나 _FILE 시크릿 마운트로 준다(deployment.md "SMTP 계정").
      # - ./smtp-accounts.json:/run/mailo/smtp-accounts.json:ro
      # 파일 채널을 켤 때: .env에 MAILO_FILE_CHANNEL_ROOT=/var/mailo/files를 주고 아래 마운트를 연다.
      # 호출처 폴더(inbox/<caller_id>/)와 권한은 호스트에서 만든다. Mailo는 non-root(node)이고 폴더를 만들지 않는다(ADR-0004 결정 8).
      # 앱은 시작할 때 /var/mailo/files/inbox가 없으면 기동을 거부한다(호스트 mount 전의 빈 디렉터리를 bind하는 경우를 막는다).
      # NAS/NFS는 docker-compose.nfs-example.yml의 named volume(driver local, type nfs) 예시를 쓴다(미검증, nfs.md). 호스트 mount를 bind하는 방식도 검증하지 않았다.
      # - /srv/mailo-files:/var/mailo/files
    ports:
      # 기본은 127.0.0.1만 연다. TLS 프록시나 다른 호스트가 접근해야 하면 MAILO_PUBLISH_HOST로 바꾼다(deployment.md).
      - "${MAILO_PUBLISH_HOST:-127.0.0.1}:${MAILO_PUBLISH_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    # 마이그레이션 적용 뒤 앱을 exec로 띄워 SIGTERM이 node에 직접 전달되게 한다.
    command:
      ["sh", "-c", "node dist/db/migrate-cli.js && exec node dist/main.js"]
    # ADR-0002 결정 12: lease 이상이어야 한다. 기본 lease 120초(MAILO_LEASE_SECONDS) + 여유 30초.
    # lease 값을 바꾸면 MAILO_STOP_GRACE_PERIOD도 함께 바꾼다. 앱이 같은 값을 읽어 부족하면 기동을 거부한다.
    stop_grace_period: ${MAILO_STOP_GRACE_PERIOD:-150s}
    # 이미지에 curl이 없어 node로 /health/live(인증 없음, DB와 무관)를 확인한다. 기동 시 마이그레이션 시간을 start_period로 둔다.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # 런타임 강화(M9). 이미지는 root 소유 읽기 전용이고 앱이 쓰는 경로는 없다. 쓰기는 마운트(파일 채널 볼륨)와 /tmp뿐이다.
    # 파일 채널 볼륨은 별도 마운트라 read_only 영향을 받지 않는다. 앱은 1024 이상 포트만 열고 특권이 필요 없어 capability를 모두 뺀다.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
